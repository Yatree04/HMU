  <script>
/* ==========================================================================
   Bookings (page title "Requests") — Figma 238:4593 (All), 238:4993 (Student)
   Group requests carry the teal right edge. Book dialog — Figma 306:2388.
   ========================================================================== */
window.HMS = window.HMS || {};
HMS.views = HMS.views || {};

HMS.views.bookings = (function () {
  const { icon, esc, kv, phoneMask } = HMS.ui;
  const D = HMS.date;
  const S = HMS.store.sel;

  const TABS = [
    { id: "all", label: "All", test: (b) => b.status === "pending" || b.status === "accepted" },
    { id: "student", label: "Student Requests", test: (b) => b.source === "student" && (b.status === "pending" || b.status === "accepted") },
    { id: "group", label: "Department & HCU", test: (b) => b.source !== "student" && (b.status === "pending" || b.status === "accepted") },
    { id: "allotted", label: "Allotted", test: (b) => b.status === "allotted" },
    { id: "past", label: "Past Requests", test: (b) => b.status === "completed" || b.status === "rejected" },
  ];
  const SOURCE = { student: "Student", department: "Department", hcu: "HCU Office", "hall-manager": "Hall Manager" };
  const STATUS = { pending: ["badge-warn", "Waiting for you"], accepted: ["badge-teal", "Needs room"], allotted: ["badge-teal", "Allotted"], completed: ["badge-grey", "Completed"], rejected: ["badge-danger", "Rejected"] };

  function card(b) {
    const group = b.kind === "group";
    const [cls, label] = STATUS[b.status];
    const days = D.days(b.from, b.to) + 1;
    const f1 = group ? kv("Number of Guests", /^\d+ /.test(b.title) ? esc(b.title) : `${b.count} · ${esc(b.title)}`) : kv("Name", esc(b.requestedBy));
    const f5 = group ? kv("Requested by", esc(b.requestedBy)) : kv("Contact Number", esc(phoneMask(b.contact)));
    const primary = b.status === "pending"
      ? `<button class="btn btn-primary" data-act="acceptBooking" data-id="${b.id}">${icon("check")} Accept</button>`
      : b.status === "accepted"
        ? `<button class="btn btn-primary" data-act="allotFromBooking" data-id="${b.id}">${icon("door")} Allot rooms</button>`
        : "";
    return `<article class="req ${group ? "group" : ""}">
      <div class="req-kind">${SOURCE[b.source] || ""}${group ? " · Group" : ""}</div>
      <span class="status badge ${cls}">${label}</span>
      <div class="req-fields">
        ${f1}${kv("Days", days)}
        ${kv("From", D.fmt(b.from))}${kv("To", D.fmt(b.to))}
        ${f5}${kv("Requested on", D.fmt(b.requestedOn))}
      </div>
      <div class="row">
        <button class="btn btn-secondary" data-act="viewBooking" data-id="${b.id}">${icon("eye")} View</button>
        ${primary}
      </div>
    </article>`;
  }

  function render(ctx) {
    const u = ctx.ui.book;
    const tab = TABS.find((t) => t.id === u.tab) || TABS[0];
    let list = S.bookings().filter(tab.test);
    if (u.q) { const q = u.q.toLowerCase(); list = list.filter((b) => (b.title + b.requestedBy + b.comments).toLowerCase().includes(q)); }
    list.sort((a, b) => (u.sortAsc ? 1 : -1) * a.requestedOn.localeCompare(b.requestedOn));
    const counts = Object.fromEntries(TABS.map((t) => [t.id, S.bookings().filter(t.test).length]));
    return `<section data-figma-node="238:4593">
      <div class="page-head">
        <h1 class="page-title">Requests</h1>
        <div class="toolbar-right">
          ${u.searchOpen ? `<span class="search">${icon("search")}<input class="input" type="search" placeholder="Search requests" value="${esc(u.q)}" data-on-input="bookQ" autofocus></span>` : `<button class="icon-btn" data-act="toggleBookSearch" aria-label="Search requests">${icon("search")}</button>`}
          <button class="icon-btn" data-act="toggleBookSort" aria-label="Sort by request date">${icon("sort")}</button>
          <button class="btn btn-primary btn-lg" data-act="newBooking">${icon("plus")} Book guests</button>
        </div>
      </div>
      <div class="tabs" role="tablist">
        ${TABS.map((t) => `<button class="tab" role="tab" aria-selected="${t.id === tab.id}" data-act="bookTab" data-tab="${t.id}">${t.label} <span class="muted">${counts[t.id]}</span></button>`).join("")}
      </div>
      ${list.length ? `<div class="req-grid">${list.map(card).join("")}</div>` : `<div class="empty"><strong>No requests here</strong>${tab.id === "all" ? "New requests from students, departments and HCU will appear here." : "Switch tabs to see other requests."}</div>`}
    </section>`;
  }

  function drawer(id) {
    const b = S.booking(id);
    const guests = b.guestIds.map((gid) => S.guest(gid));
    const stays = S.bookingStays(b.id);
    const roomOf = (gid) => (stays.find((s) => s.personId === gid) || {}).room;
    const [cls, label] = STATUS[b.status];
    return `<div class="drawer-head">
        <div><div class="req-kind">${SOURCE[b.source] || ""} · ${esc(b.id)}</div><h2 class="modal-title" style="padding:0">${esc(b.title)}</h2></div>
        <button class="icon-btn" data-act="closeLayer" aria-label="Close">${icon("x")}</button>
      </div>
      <div class="drawer-body">
        <p><span class="badge ${cls}">${label}</span></p>
        <div class="pgrid" style="margin:14px 0 18px">
          ${kv("Requested by", esc(b.requestedBy) + (b.requesterRoll ? " · " + esc(b.requesterRoll) : ""))}${kv("Requested on", D.fmt(b.requestedOn))}
          ${kv("From", D.fmt(b.from))}${kv("To", D.fmt(b.to))}
          ${kv("Days", D.days(b.from, b.to) + 1)}${kv("Contact Number", esc(phoneMask(b.contact)))}
        </div>
        ${kv("Comments", esc(b.comments || "—"), "comments")}
        ${b.rejectReason ? `<div class="warn-line">Rejected: ${esc(b.rejectReason)}</div>` : ""}
        <h3 style="font-size:13px;margin:22px 0 8px">Guests (${guests.length})</h3>
        ${guests.length ? `<table class="data"><thead><tr><th>Name</th><th>Relation</th><th>Room</th></tr></thead><tbody>
          ${guests.map((g) => `<tr><td>${esc(g.name)}</td><td style="font-weight:400">${esc(g.relation || "—")}</td><td>${roomOf(g.id) ? `<button class="link" data-act="go" data-href="#/map?floor=${HMS.floorplan.parseRoom(roomOf(g.id)).floor}&room=${roomOf(g.id)}">${roomOf(g.id)}</button>` : `<span class="muted">Not allotted</span>`}</td></tr>`).join("")}
        </tbody></table>` : `<p class="muted" style="font-size:12px">No guest list attached.</p>`}
      </div>
      <div class="drawer-foot">
        ${b.status === "pending" ? `<button class="btn btn-danger btn-lg" data-act="rejectBooking" data-id="${b.id}">${icon("x")} Reject</button><button class="btn btn-primary btn-lg" data-act="acceptBooking" data-id="${b.id}">${icon("check")} Accept</button>` : ""}
        ${b.status === "accepted" ? `<button class="btn btn-primary btn-lg" data-act="allotFromBooking" data-id="${b.id}">${icon("door")} Allot rooms on map</button>` : ""}
        ${b.status === "allotted" ? `<button class="btn btn-secondary btn-lg" data-act="editBooking" data-id="${b.id}">${icon("pencil")} Change dates</button>` : ""}
      </div>`;
  }

  /** Book dialog (306:2388): Book / Notify tabs, "Add Guest", list with checkboxes, Request */
  function bookDialog(draft) {
    return `<div class="modal-head"><div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="${draft.tab === "book"}" data-act="bookDraftTab" data-tab="book">Book</button>
        <button class="tab" role="tab" aria-selected="${draft.tab === "notify"}" data-act="bookDraftTab" data-tab="notify">Notify</button>
      </div></div>
      <div class="modal-body">
      ${draft.tab === "book" ? `
        <div class="add-resident">${icon("plus")}<input placeholder="Add Guest" id="draft-guest" data-on-enter="draftAddGuest" aria-label="Guest name, press Enter to add"></div>
        <div class="pgrid" style="margin-top:14px">
          <label class="field"><span>From</span><input class="input" type="date" id="draft-from" value="${draft.from}"></label>
          <label class="field"><span>To</span><input class="input" type="date" id="draft-to" value="${draft.to}"></label>
          <label class="field" style="grid-column:1/-1"><span>Comments</span><textarea class="input" id="draft-comments" rows="2" placeholder="Why they are staying, who asked">${esc(draft.comments)}</textarea></label>
        </div>
        <div class="cand-list">
          ${draft.guests.length ? draft.guests.map((g, i) => `<div class="cand">
            ${kv("Name", esc(g.name))}${kv("Days", D.days(draft.from, draft.to) + 1)}<span></span>
            <input type="checkbox" class="checkbox check" checked data-on-change="draftToggle" data-i="${i}" aria-label="Include ${esc(g.name)}">
          </div>`).join("") : `<div class="empty" style="padding:20px">Type a guest's name above and press Enter.</div>`}
        </div>` : `
        <label class="field"><span>Send to</span><select class="select-input" id="draft-notify-to"><option>HCU Office</option><option>Warden</option><option>Mess Committee</option></select></label>
        <label class="field" style="margin-top:12px"><span>Message</span><textarea class="input" id="draft-notify-msg" rows="4" placeholder="What should they know?"></textarea></label>`}
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-act="closeLayer">${icon("x")} Cancel</button>
        ${draft.tab === "book" ? `<button class="btn btn-primary" data-act="draftSubmit" ${draft.guests.filter((g) => g.on).length ? "" : "disabled"}>${icon("check")} Request</button>` : `<button class="btn btn-primary" data-act="draftNotify">${icon("send")} Send</button>`}
      </div>`;
  }

  return { render, drawer, bookDialog, TABS };
})();

</script>
  <script>
/* ==========================================================================
   Hostel Map — Figma 238:5393 (map), 238:5576 (Allot, one person),
   238:5796 (Allot, two people), 262:6633 (Add Resident search open).
   Occupied-room detail content comes from the older Version 1 frame 266:4130.
   The map is date-aware: room colours reflect who is there on the chosen day.
   ========================================================================== */
window.HMS = window.HMS || {};
HMS.views = HMS.views || {};

HMS.views.map = (function () {
  const { icon, esc, kv, phoneMask } = HMS.ui;
  const D = HMS.date;
  const S = HMS.store.sel;
  const FP = HMS.floorplan;

  const STATES = {
    allotted: { label: "Allotted", bg: "var(--room-allotted-bg)", stroke: "var(--room-allotted-stroke)" },
    empty: { label: "Unoccupied", bg: "var(--room-empty-bg)", stroke: "var(--room-empty-stroke)" },
    guest: { label: "Guests", bg: "var(--room-guest-bg)", stroke: "var(--room-guest-stroke)", dash: "3 2" },
    maintenance: { label: "Maintenance", bg: "var(--room-maint-bg)", stroke: "var(--room-maint-stroke)" },
  };

  function svg(ctx) {
    const m = ctx.ui.map;
    const day = ctx.ui.day;
    const counts = { allotted: 0, empty: 0, guest: 0, maintenance: 0 };
    const rooms = FP.SLOTS.map((s) => {
      const no = FP.roomNo(m.floor, s.idx);
      const st = S.roomState(no, day);
      counts[st]++;
      const def = STATES[st];
      const dim = (m.wing !== "all" && s.wing !== m.wing) ? "dim" : !m.show[st] ? "hidden-state" : "";
      const sel = m.room === no ? "selected" : "";
      const occ = st === "allotted" || st === "guest" ? S.occupants(no, day) : [];
      const over = occ.length > 2 ? `<circle class="flag" cx="${s.x + s.w - 4}" cy="${s.y + 4}" r="3"/>` : "";
      const title = `Room ${no} · ${def.label}${occ.length ? " · " + occ.map((o) => o.person.name).join(", ") : ""}`;
      const label = m.labels ? `<text x="${s.x + s.w / 2}" y="${s.y + s.h / 2 + 3}" text-anchor="middle">${s.idx}</text>` : "";
      return `<g class="room ${dim} ${sel}" tabindex="0" role="button" aria-label="${esc(title)}" data-act="openRoom" data-room="${no}">
        <title>${esc(title)}</title>
        <rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="4.8" fill="${def.bg}" stroke="${def.stroke}" stroke-width="1" ${def.dash ? `stroke-dasharray="${def.dash}"` : ""}/>
        ${label}${over}</g>`;
    }).join("");
    const blocks = FP.blocks.map((b) => `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="4.8" fill="${b.kind === "service" ? "var(--room-service-bg)" : "var(--room-common-bg)"}"><title>${b.label}</title></rect>`).join("");
    const c = FP.courtyard;
    return {
      counts,
      html: `<svg viewBox="${FP.viewBox}" role="group" aria-label="Floor ${m.floor} plan">
        <path d="${FP.outline}" fill="var(--primary-bg)" stroke="var(--primary-cta-bg)" stroke-width="2"/>
        <rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="10" fill="#fff" stroke="var(--primary-cta-bg)" stroke-width="2"/>
        ${blocks}${rooms}
      </svg>`,
    };
  }

  function legend(ctx, counts) {
    const m = ctx.ui.map;
    const item = (k) => `<button class="legend-item" aria-pressed="${m.show[k]}" data-act="toggleLegend" data-k="${k}">
      <span class="sw" style="background:${STATES[k].bg};border-color:${STATES[k].stroke};${STATES[k].dash ? "border-style:dashed" : ""}"></span>${STATES[k].label} <span class="n num">${counts[k]}</span></button>`;
    return `<div class="map-legend">${item("allotted")}${item("empty")}${item("guest")}${item("maintenance")}
      <span class="legend-item"><span class="sw" style="background:var(--room-service-bg);border-color:var(--room-service-bg)"></span>Service</span>
      <span class="legend-item"><span class="sw" style="background:var(--room-common-bg);border-color:var(--room-common-bg)"></span>Stairs &amp; common</span></div>`;
  }

  function dateSelects(day) {
    const [y, mo, d] = day.split("-").map(Number);
    const days = new Date(y, mo, 0).getDate();
    const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const box = (part, opts, label) => `<label class="box-select"><span class="sr-only">${label}</span><select data-on-change="setDatePart" data-part="${part}">${opts}</select>${icon("caretDown")}</label>`;
    return `<div class="map-top">
      ${box("d", Array.from({ length: days }, (_, i) => `<option value="${i + 1}" ${i + 1 === d ? "selected" : ""}>${String(i + 1).padStart(2, "0")}</option>`).join(""), "Day")}
      ${box("m", months.map((n, i) => `<option value="${i + 1}" ${i + 1 === mo ? "selected" : ""}>${n}</option>`).join(""), "Month")}
      ${box("y", [2025, 2026, 2027].map((v) => `<option ${v === y ? "selected" : ""}>${v}</option>`).join(""), "Year")}
    </div>`;
  }

  function render(ctx) {
    const m = ctx.ui.map;
    const { html, counts } = svg(ctx);
    const floors = FP.FLOORS;
    const i = floors.indexOf(m.floor);
    const visible = floors.slice(Math.max(0, Math.min(i - 1, floors.length - 3)), Math.max(0, Math.min(i - 1, floors.length - 3)) + 3).reverse();
    const pendingGuests = S.unhousedGuests().length;
    return `<section class="map-page" data-figma-node="238:5393">
      <div>
        ${dateSelects(ctx.ui.day)}
        ${pendingGuests ? `<p class="note" style="margin:0 auto 14px">${pendingGuests} guest${pendingGuests > 1 ? "s" : ""} from accepted requests still need a room. Click an unoccupied room to allot.</p>` : ""}
        <div class="map-canvas" id="map-canvas">${html}</div>
        ${legend(ctx, counts)}
      </div>
      <aside class="map-side">
        <label class="box-select"><span class="sr-only">Wing</span><select data-on-change="setWing">
          <option value="all" ${m.wing === "all" ? "selected" : ""}>All wings</option>
          ${FP.WINGS.map((w) => `<option value="${w}" ${m.wing === w ? "selected" : ""}>Wing ${w}</option>`).join("")}
        </select>${icon("caretDown")}</label>
        <div class="map-options"><input type="checkbox" class="checkbox" id="lbl" ${m.labels ? "checked" : ""} data-on-change="toggleLabels"><label for="lbl">Room numbers</label></div>
        <nav class="floor-stepper" aria-label="Floor">
          <button class="step" data-act="floorStep" data-d="1" aria-label="Floor up" ${i >= floors.length - 1 ? "disabled" : ""}>${icon("caretUp")}</button>
          ${visible.map((f) => `<button class="floor-btn" aria-current="${f === m.floor}" data-act="setFloor" data-f="${f}">${f}</button>`).join("")}
          <button class="step" data-act="floorStep" data-d="-1" aria-label="Floor down" ${i <= 0 ? "disabled" : ""}>${icon("caretDown")}</button>
        </nav>
      </aside>
    </section>`;
  }

  /* --------------------------- Room dialogs --------------------------- */
  function head(room, tab, tabs) {
    return `<div class="modal-head"><div class="tabs" role="tablist">${tabs.map(([id, l]) => `<button class="tab" role="tab" aria-selected="${tab === id}" data-act="roomTab" data-tab="${id}">${l}</button>`).join("")}</div><div class="modal-room num">${room}</div></div>`;
  }

  function candRow(guest, booking, checked) {
    return `<div class="cand">
      ${booking.kind === "group" ? `<div class="cand-group">${esc(booking.title)} · ${esc(booking.requestedBy)}</div>` : ""}
      ${kv("Name", esc(guest.name))}${kv("Days", D.days(booking.from, booking.to) + 1)}<span></span>
      <input type="checkbox" class="checkbox check" ${checked ? "checked" : ""} data-on-change="toggleCand" data-id="${guest.id}" aria-label="Allot ${esc(guest.name)}">
      ${kv("From", D.fmt(booking.from))}${kv("To", D.fmt(booking.to))}${kv("Comments", esc(booking.comments || "—"), "comments")}
      ${kv("Contact Number", esc(phoneMask(guest.contact || booking.contact)))}${kv("Requested on", D.fmt(booking.requestedOn))}
    </div>`;
  }

  /** Allot / Notify dialog for an unoccupied room (238:5576 / 238:5796) */
  function allotDialog(ctx, d) {
    const room = d.room;
    let body;
    if (d.tab === "allot") {
      const pool = S.unhousedGuests();
      const shown = pool.filter((p) => d.showAll || d.picked.includes(p.guest.id) || d.focusBooking === p.booking.id);
      const rest = pool.filter((p) => !shown.includes(p));
      const q = (d.q || "").toLowerCase();
      const suggestions = q ? [
        ...rest.filter((p) => p.guest.name.toLowerCase().includes(q)).map((p) => ({ act: "pickGuest", id: p.guest.id, label: p.guest.name, sub: p.booking.title + " · from " + D.fmt(p.booking.from) })),
        ...S.raw().residents.filter((r) => !r.room && r.name.toLowerCase().includes(q)).map((r) => ({ act: "pickResident", id: r.id, label: r.name, sub: r.roll + " · no room" })),
        { act: "pickWalkIn", id: d.q, label: `Add “${d.q}” as a new guest`, sub: "Creates a booking for today" },
      ].slice(0, 8) : [];
      const n = d.picked.length + (d.resident ? 1 : 0) + (d.walkIn ? 1 : 0);
      body = `
        <div class="add-resident">${icon("plus")}<input placeholder="Add Resident" value="${esc(d.q || "")}" data-on-input="allotQ" aria-label="Search people waiting for a room" autocomplete="off" autofocus>
          ${suggestions.length ? `<div class="suggest" role="listbox">${suggestions.map((s) => `<button role="option" data-act="${s.act}" data-id="${esc(s.id)}"><span>${esc(s.label)}</span><small>${esc(s.sub)}</small></button>`).join("")}</div>` : ""}
        </div>
        ${!q && rest.length && !d.showAll ? `<p class="muted" style="font-size:11px;margin:10px 4px 0">${rest.length} more waiting · type a name, or <button class="link" data-act="showAllWaiting">show all</button></p>` : ""}
        <div class="cand-list">
          ${d.resident ? (() => { const r = S.resident(d.resident); return `<div class="cand">${kv("Name", esc(r.name))}${kv("Roll Number", esc(r.roll))}<span></span><input type="checkbox" class="checkbox check" checked data-act="unpickResident" aria-label="Remove">${kv("Allot from", D.fmt(ctx.ui.day))}${kv("Programme", esc(r.degree))}${kv("Department", esc(r.dept))}</div>`; })() : ""}
          ${d.walkIn ? `<div class="cand">${kv("Name", esc(d.walkIn))}${kv("Days", `<input class="input" type="number" min="1" value="${d.walkInDays}" data-on-input="walkInDays" style="width:64px;height:24px">`)}<span></span><input type="checkbox" class="checkbox check" checked data-act="unpickWalkIn" aria-label="Remove">${kv("From", D.fmt(ctx.ui.day))}${kv("To", D.fmt(D.add(ctx.ui.day, d.walkInDays - 1)))}</div>` : ""}
          ${shown.map((p) => candRow(p.guest, p.booking, d.picked.includes(p.guest.id))).join("")}
          ${!shown.length && !d.resident && !d.walkIn ? `<div class="empty" style="padding:22px 10px"><strong>No one picked yet</strong>Search above for a guest from an accepted request, a resident without a room, or type a new name.</div>` : ""}
        </div>
        ${n > 2 ? `<div class="warn-line">That's ${n} people for one room. H17 rooms are singles; guests can share two to a room.</div>` : ""}`;
      return `${head(room, "allot", [["allot", "Allot"], ["notify", "Notify"]])}<div class="modal-body">${body}</div>
        <div class="modal-foot">
          <button class="btn btn-secondary" data-act="setMaintenancePrompt" style="margin-right:auto">${icon("wrench")} Mark for repair</button>
          <button class="btn btn-secondary" data-act="closeLayer">${icon("x")} Cancel</button>
          <button class="btn btn-primary" data-act="confirmAllot" ${n ? "" : "disabled"}>${icon("check")} Allot Room ${room}</button>
        </div>`;
    }
    return `${head(room, "notify", [["allot", "Allot"], ["notify", "Notify"]])}${notifyBody(room)}`;
  }

  function notifyBody(room) {
    return `<div class="modal-body">
        <label class="field"><span>Send to</span><select class="select-input" id="notify-to"><option>HCU Office</option><option>Warden</option><option>Requester</option><option>Resident</option><option>Maintenance cell</option></select></label>
        <label class="field" style="margin-top:12px"><span>Message</span><textarea class="input" id="notify-msg" rows="4">Room ${room}: </textarea></label>
      </div>
      <div class="modal-foot"><button class="btn btn-secondary" data-act="closeLayer">${icon("x")} Cancel</button><button class="btn btn-primary" data-act="sendNotify" data-room="${room}">${icon("send")} Send</button></div>`;
  }

  /** Occupied room (resident or guest) — content from Version 1 panel 266:4130 */
  function occupiedDialog(ctx, d) {
    const room = d.room;
    if (d.tab === "notify") return `${head(room, "notify", [["details", "Details"], ["notify", "Notify"]])}${notifyBody(room)}`;
    const occ = S.occupants(room, ctx.ui.day);
    const cards = occ.map(({ stay, person }) => {
      if (stay.kind === "resident") {
        return `<div class="occupant"><div class="req-kind">Resident · ${esc(person.roll)}</div><h3>${esc(person.name)}</h3>
          <div class="pgrid pgrid-3">${kv("Allocation Date", D.fmt(stay.from))}${kv("Programme", esc(person.degree))}${kv("Department", esc(person.dept))}
          ${kv("Contact Number", esc(phoneMask(person.phone)))}${kv("Faculty advisor", esc(person.advisor.name))}${kv("Local Guardian", esc(person.guardian.name))}</div>
          ${person.remarks[0] ? `<div class="status-box">${esc(person.remarks[0].text)}</div>` : ""}
          <div class="row" style="display:flex;gap:10px;margin-top:12px"><button class="btn btn-secondary" data-act="go" data-href="#/residents/${person.id}">${icon("eye")} Open profile</button><button class="btn btn-danger" data-act="vacateResident" data-id="${person.id}">Mark vacated</button></div></div>`;
      }
      const b = S.booking(person.bookingId);
      const extending = d.extend === stay.id;
      return `<div class="occupant"><div class="req-kind">Guest${b ? " · " + esc(b.title) : ""}</div><h3>${esc(person.name)}</h3>
        <div class="pgrid pgrid-3">${kv("Allocation Date", D.fmt(stay.from))}${kv("Vacation Date", D.fmt(stay.to))}${kv("Days", D.days(stay.from, stay.to) + 1)}
        ${kv("Contact Number", esc(phoneMask(person.contact || (b && b.contact))))}${kv("Requested by", esc(b ? b.requestedBy : "—"))}${kv("Comments", esc(b ? b.comments : "—"), "comments")}</div>
        <div class="status-box">Accommodation<br>${D.fmt(stay.from)}  -  ${D.fmt(stay.to)}${stay.to < ctx.ui.day ? " · overstaying" : stay.to === ctx.ui.day ? " · leaves today" : ""}</div>
        ${extending ? `<div style="display:flex;gap:8px;align-items:end;margin-bottom:10px"><label class="field" style="flex:1"><span>New departure date</span><input class="input" type="date" id="extend-to" value="${D.add(stay.to, 2)}" min="${stay.to}"></label><button class="btn btn-primary" data-act="confirmExtend" data-id="${stay.id}">Save</button></div>` : ""}
        <div class="stack">
          <button class="btn-outline-pill" data-act="extendStay" data-id="${stay.id}">Increase Accommodation</button>
          <button class="btn-outline-pill" data-act="checkOut" data-id="${stay.id}">Check out today</button>
        </div></div>`;
    }).join("");
    return `${head(room, "details", [["details", "Details"], ["notify", "Notify"]])}
      <div class="modal-body">${cards}
        ${occ.length === 1 && occ[0].stay.kind === "guest" ? `<button class="link" data-act="roomAddMore" style="font-size:12px">+ Add another guest to this room</button>` : ""}
      </div>
      <div class="modal-foot"><button class="btn btn-secondary" data-act="closeLayer">Close</button></div>`;
  }

  function maintenanceDialog(ctx, room) {
    const m = S.maintenanceIn(room, ctx.ui.day);
    return `<div class="modal-head"><h2 class="modal-title">Under repair</h2><div class="modal-room num">${room}</div></div>
      <div class="modal-body"><div class="pgrid">${kv("Issue", esc(m.note))}${kv("Since", D.fmt(m.from))}${kv("Expected back", m.to ? D.fmt(m.to) : "Not set")}${kv("Reported by", esc(m.reportedBy))}</div></div>
      <div class="modal-foot"><button class="btn btn-secondary" data-act="closeLayer">Close</button><button class="btn btn-primary" data-act="clearMaintenance" data-room="${room}">${icon("check")} Mark repaired</button></div>`;
  }

  return { render, allotDialog, occupiedDialog, maintenanceDialog, STATES };
})();

</script>

  <script>
/* ==========================================================================
   App — shell, hash router, UI state, and every user action.

   Pattern: elements declare intent with data attributes, one delegated
   listener routes them here.
     data-act="name"        click / Enter / Space
     data-on-input="name"   input events
     data-on-change="name"  change events
     data-on-enter="name"   Enter key in an input
   Handlers receive (el, event). Re-render is full-page but focus + caret
   are restored, so typing in search boxes feels normal.
   ========================================================================== */
window.HMS = window.HMS || {};

(function () {
  const S = HMS.store.sel, A = HMS.store.act, D = HMS.date, UI = HMS.ui;
  const { icon, esc } = UI;

  /* ------------------------------ UI state ------------------------------ */
  const ui = {
    day: HMS.TODAY,
    guestQ: "", guestSearchOpen: false, guestSortAsc: true, updatesQ: "",
    res: { tab: "Bachelors", filters: [], filterOpen: false, perPage: "50", page: 1, q: "", sort: { key: "room", dir: 1 } },
    book: { tab: "all", q: "", searchOpen: false, sortAsc: false },
    map: { floor: 3, wing: "all", show: { allotted: true, empty: true, guest: true, maintenance: true }, room: null, labels: false, focusBooking: null },
    pop: null, searchQ: "",
  };
  let dlg = null;      // current dialog state
  let route = { path: "dashboard", id: null, query: {} };

  /* ------------------------------- Router ------------------------------- */
  const NAV = [
    ["dashboard", "Dashboard"], ["residents", "Residents"], ["bookings", "Bookings"], ["map", "Hostel Map"], ["actions", "Actions"],
  ];
  function parseHash() {
    const h = location.hash.replace(/^#\/?/, "") || "dashboard";
    const [p, qs] = h.split("?");
    const [path, id] = p.split("/");
    const query = Object.fromEntries(new URLSearchParams(qs || ""));
    return { path, id: id || null, query };
  }
  function onRoute() {
    const prev = route;
    route = parseHash();
    const q = route.query;
    if (route.path === "residents" && !route.id) {
      if (q.tab) ui.res.tab = q.tab;
      if (prev.path !== "residents" || q.tab) ui.res.page = 1;
    }
    if (route.path === "map") {
      if (q.floor) ui.map.floor = Number(q.floor);
      if (q.show === "empty") ui.map.show = { allotted: false, empty: true, guest: false, maintenance: false };
      ui.map.room = q.room || null;
    }
    ui.pop = null;
    UI.close(true); dlg = null;
    render();
    window.scrollTo(0, 0);
    if (route.path === "map" && q.room) openRoom(q.room);
  }
  const go = (href) => { if (location.hash === href) onRoute(); else location.hash = href; };

  /* ------------------------------- Render ------------------------------- */
  function shell(inner) {
    const open = S.updates().filter((u) => u.state === "open").length;
    const active = route.path === "residents" && route.id ? "residents" : route.path;
    return `<div class="shell">
      <header class="topbar">
        <a class="brand" href="#/dashboard">${UI.logo}<span><div class="brand-name">Hostel Management</div><div class="brand-sub">Indian Institute of Technology Bombay</div></span></a>
        <div class="topbar-actions">
          <button class="icon-btn" data-act="toggleSearch" aria-label="Search" aria-expanded="${ui.pop === "search"}">${icon("search")}</button>
          <button class="icon-btn" data-act="toggleBell" aria-label="Updates, ${open} open" aria-expanded="${ui.pop === "bell"}">${icon("bell")}${open ? '<span class="dot"></span>' : ""}</button>
          <span class="avatar" title="Hall Manager, Hostel 17">A</span>
          ${ui.pop === "search" ? searchPop() : ""}
          ${ui.pop === "bell" ? `<div class="popover bell-pop" role="dialog" aria-label="Updates">${HMS.views.dashboard.updatesPanel("")}</div>` : ""}
        </div>
      </header>
      <aside class="sidebar">
        <nav class="nav" aria-label="Main">${NAV.map(([p, l]) => `<a href="#/${p}" ${active === p ? 'aria-current="page"' : ""}>${l}</a>`).join("")}</nav>
        <a class="nav-settings" href="#/settings" ${active === "settings" ? 'aria-current="page"' : ""}>${icon("gear")} Settings</a>
      </aside>
      <main class="main" id="main">${inner}</main>
    </div>`;
  }

  function searchPop() {
    const res = S.search(ui.searchQ);
    return `<div class="popover search-pop" role="dialog" aria-label="Search">
      <input class="input" type="search" placeholder="Name, roll number or room" value="${esc(ui.searchQ)}" data-on-input="globalSearchQ" autofocus>
      <div class="search-results">${ui.searchQ && !res.length ? `<div class="empty" style="padding:16px">No match for “${esc(ui.searchQ)}”.</div>` : res.map((r) => `<button data-act="openSearchResult" data-type="${r.type}" data-id="${esc(r.id)}"><span>${esc(r.label)}</span><small>${esc(r.sub)}</small></button>`).join("")}</div>
    </div>`;
  }

  function view() {
    const ctx = { ui, query: route.query };
    const V = HMS.views;
    switch (route.path) {
      case "residents": return route.id ? V.residents.profile(ctx, route.id) : V.residents.render(ctx);
      case "bookings": return V.bookings.render(ctx);
      case "map": return V.map.render(ctx);
      case "actions": return V.actions.render(ctx);
      case "settings": return V.settings.render(ctx);
      default: return V.dashboard.render(ctx);
    }
  }

  function focusKey(el) {
    if (!el || !el.dataset) return null;
    const k = el.dataset.onInput || el.dataset.onChange || el.dataset.onEnter || el.id;
    return k ? { k, i: el.dataset.i, kk: el.dataset.k, s: el.selectionStart, e: el.selectionEnd, inLayer: !!el.closest(".layer") } : null;
  }
  function restoreFocus(f, root) {
    if (!f) return;
    const el = [...root.querySelectorAll("input, textarea, select")].find((x) => (x.dataset.onInput || x.dataset.onChange || x.dataset.onEnter || x.id) === f.k && x.dataset.i === f.i && x.dataset.k === f.kk);
    if (el) { el.focus(); try { if (f.s != null) el.setSelectionRange(f.s, f.e); } catch (e) { /* not text */ } }
  }

  function render() {
    const f = focusKey(document.activeElement);
    const root = document.getElementById("app");
    root.innerHTML = shell(view());
    if (f && !f.inLayer) restoreFocus(f, root);
  }
  function renderDialog() {
    if (!dlg) return;
    const f = focusKey(document.activeElement);
    const ctx = { ui, query: route.query };
    const html = dialogHtml(ctx);
    const kind = dlg.type === "booking" ? "drawer" : dlg.type === "occupied" || dlg.type === "allot" ? "wide" : "modal";
    if (UI.isOpen() && dlg.rendered) UI.replace(html);
    else { UI.open(html, { kind, onClose: () => { dlg = null; ui.map.room = null; render(); } }); dlg.rendered = true; }
    const layer = document.querySelector(".layer");
    if (f && f.inLayer && layer) restoreFocus(f, layer);
  }
  function dialogHtml(ctx) {
    const V = HMS.views;
    switch (dlg.type) {
      case "allot": return V.map.allotDialog(ctx, dlg);
      case "occupied": return V.map.occupiedDialog(ctx, dlg);
      case "maint": return V.map.maintenanceDialog(ctx, dlg.room);
      case "booking": return V.bookings.drawer(dlg.id);
      case "book": return V.bookings.bookDialog(dlg);
      case "form": return dlg.html();
      default: return "";
    }
  }
  function openDialog(state) { UI.close(true); dlg = state; renderDialog(); }
  function closeDialog() { UI.close(true); dlg = null; render(); }
  function form(title, fields, submitLabel, onSubmit, opts = {}) {
    openDialog({ type: "form", onSubmit, html: () => `
      <div class="modal-head"><h2 class="modal-title">${esc(title)}</h2></div>
      <div class="modal-body">${opts.intro ? `<p class="muted" style="font-size:12px;margin:0 0 14px">${opts.intro}</p>` : ""}<div class="stack">${fields}</div></div>
      <div class="modal-foot"><button class="btn btn-secondary" data-act="closeLayer">Cancel</button><button class="btn ${opts.danger ? "btn-danger" : "btn-primary"}" data-act="submitForm">${esc(submitLabel)}</button></div>` });
  }

  /* ------------------------------ Map helpers ------------------------------ */
  function openRoom(room) {
    const { floor } = HMS.floorplan.parseRoom(room);
    if (ui.map.floor !== floor) { ui.map.floor = floor; }
    ui.map.room = room;
    render();
    const st = S.roomState(room, ui.day);
    if (st === "empty") {
      const picked = [];
      if (ui.map.focusBooking) for (const p of S.unhousedGuests()) if (p.booking.id === ui.map.focusBooking && picked.length < 2) picked.push(p.guest.id);
      openDialog({ type: "allot", room, tab: "allot", picked, focusBooking: ui.map.focusBooking, q: "", resident: null, walkIn: null, walkInDays: 2, showAll: false });
    } else if (st === "maintenance") openDialog({ type: "maint", room });
    else openDialog({ type: "occupied", room, tab: "details", extend: null });
  }
  function setDay(part, v) {
    let [y, m, d] = ui.day.split("-").map(Number);
    if (part === "y") y = Number(v); if (part === "m") m = Number(v); if (part === "d") d = Number(v);
    d = Math.min(d, new Date(y, m, 0).getDate());
    ui.day = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  }

  /* -------------------------------- Actions -------------------------------- */
  const H = {
    go: (el) => go(el.dataset.href),
    back: () => history.length > 1 ? history.back() : go("#/residents"),
    closeLayer: () => closeDialog(),

    // header
    toggleSearch: () => { ui.pop = ui.pop === "search" ? null : "search"; render(); },
    toggleBell: () => { ui.pop = ui.pop === "bell" ? null : "bell"; render(); },
    globalSearchQ: (el) => { ui.searchQ = el.value; render(); },
    openSearchResult: (el) => {
      const { type, id } = el.dataset; ui.pop = null; ui.searchQ = "";
      if (type === "resident") go("#/residents/" + id);
      else if (type === "room") go(`#/map?floor=${HMS.floorplan.parseRoom(id).floor}&room=${id}`);
      else { const st = S.raw().stays.find((s) => s.personId === id); if (st) go(`#/map?floor=${HMS.floorplan.parseRoom(st.room).floor}&room=${st.room}`); else openDialog({ type: "booking", id: S.guest(id).bookingId }); }
    },

    // dashboard
    setDatePart: (el) => { setDay(el.dataset.part, el.value); render(); },
    toggleGuestSearch: () => { ui.guestSearchOpen = !ui.guestSearchOpen; if (!ui.guestSearchOpen) ui.guestQ = ""; render(); },
    toggleGuestSort: () => { ui.guestSortAsc = !ui.guestSortAsc; render(); UI.toast(ui.guestSortAsc ? "Earliest arrival first" : "Latest arrival first"); },
    guestQ: (el) => { ui.guestQ = el.value; render(); },
    updatesQ: (el) => { ui.updatesQ = el.value; render(); },
    resolveUpdate: (el) => {
      const u = S.updates().find((x) => x.id === el.dataset.id); const ok = el.dataset.ok === "1";
      A.resolveUpdate(u.id, ok);
      if (u.type === "booking" && ok) UI.toast("Request accepted. Allot rooms from the map.", { act: "allotFromBooking", label: "Allot now", data: `data-id="${u.bookingId}"` });
      else if (u.type === "extension" && ok) UI.toast("Stay extended to " + D.fmt(u.to));
      else if (u.type === "maintenance" && ok) UI.toast("Room " + u.room + " marked under repair");
      else UI.toast(ok ? "Done" : "Dismissed");
      render();
    },
    editBooking: (el) => {
      const b = S.booking(el.dataset.id);
      form("Change dates · " + b.title, `
        <label class="field"><span>Arrival</span><input class="input" type="date" name="from" value="${b.from}"></label>
        <label class="field"><span>Departure</span><input class="input" type="date" name="to" value="${b.to}"></label>`, "Save dates",
        (v) => { if (v.to < v.from) return "Departure can't be before arrival."; A.updateBookingDates(b.id, v.from, v.to); UI.toast("Dates updated for " + b.title); },
        { intro: `Rooms ${S.bookingRooms(b.id).join(", ") || "not allotted yet"}. Changing dates updates every guest in this booking.` });
    },

    // residents
    resTab: (el, e) => { if (e.target.closest("[data-act=removeTab]")) return; ui.res.tab = el.dataset.tab; ui.res.page = 1; ui.res.filters = []; if (route.query.tab || route.query.arriving || route.query.leaving) go("#/residents"); else render(); },
    removeTab: (el) => { A.removeCustomTab(el.dataset.id); if (ui.res.tab === el.dataset.id) ui.res.tab = "Bachelors"; render(); },
    toggleFilter: () => { ui.res.filterOpen = !ui.res.filterOpen; render(); },
    closeFilter: () => { ui.res.filterOpen = false; render(); },
    clearFilters: () => { ui.res.filters = []; ui.res.page = 1; render(); },
    filterAdd: () => { if (!ui.res.filters.length) ui.res.filters.push({ col: "", op: "contains", val: "" }); ui.res.filters.push({ col: "", op: "contains", val: "" }); render(); },
    filterRemove: (el) => { ui.res.filters.splice(Number(el.dataset.i), 1); render(); },
    filterEdit: (el) => { const i = Number(el.dataset.i); if (!ui.res.filters[i]) ui.res.filters[i] = { col: "", op: "contains", val: "" }; ui.res.filters[i][el.dataset.k] = el.value; ui.res.page = 1; render(); },
    saveTabPrompt: () => {
      const custom = S.customTabs().find((t) => t.id === ui.res.tab);
      const base = custom ? custom.base : ui.res.tab;
      form("Save as a tab", `<label class="field"><span>Tab name</span><input class="input" name="name" placeholder="e.g. PhD · thesis submitted" autofocus></label>`, "Save tab",
        (v) => { if (!v.name.trim()) return "Give the tab a name."; const t = A.saveCustomTab({ name: v.name.trim(), base, filters: ui.res.filters.filter((f) => f.col && f.val !== "") }); ui.res.tab = t.id; ui.res.filters = []; ui.res.filterOpen = false; UI.toast("Saved tab “" + t.name + "”"); },
        { intro: `Keeps the current ${esc(base)} view${ui.res.filters.length ? " and its filters" : ""} one click away.` });
    },
    perPage: (el) => { ui.res.perPage = el.value; ui.res.page = 1; render(); },
    resQ: (el) => { ui.res.q = el.value; ui.res.page = 1; render(); },
    sortBy: (el) => { const k = el.dataset.key; ui.res.sort = { key: k, dir: ui.res.sort.key === k ? -ui.res.sort.dir : 1 }; render(); },
    page: (el) => { ui.res.page = Math.max(1, ui.res.page + Number(el.dataset.d)); render(); },
    exportResidents: () => { const { rows, cols } = HMS.views.residents.rowsFor({ ui, query: route.query }); copyCsv(rows, cols, rows.length + " rows"); },
    exportAll: () => { copyCsv(S.residentRows(null, ui.day), HMS.views.residents.COLS.resident, "all residents"); },
    editResident: (el) => {
      const r = S.resident(el.dataset.id);
      form("Edit · " + r.name, `
        <label class="field"><span>Mobile</span><input class="input" name="phone" value="${esc(r.phone)}" inputmode="tel"></label>
        <label class="field"><span>Department</span><input class="input" name="dept" value="${esc(r.dept)}"></label>
        <label class="field"><span>Current semester</span><input class="input" name="semester" type="number" min="1" max="12" value="${r.semester}"></label>
        <label class="field"><span>Permanent address</span><textarea class="input" name="homeAddress" rows="2">${esc(r.homeAddress)}</textarea></label>`, "Save changes",
        (v) => { A.updateResident(r.id, { ...v, semester: Number(v.semester) }); UI.toast("Saved " + r.name); });
    },
    editGuestStay: (el) => { const st = S.raw().stays.find((s) => s.personId === el.dataset.id); if (st) go(`#/map?floor=${HMS.floorplan.parseRoom(st.room).floor}&room=${st.room}`); },
    vacateResident: (el) => {
      const r = S.resident(el.dataset.id);
      form("Mark " + r.name + " as vacated?", `<label class="field"><span>Vacate date</span><input class="input" type="date" name="day" value="${ui.day}"></label>`, "Mark vacated",
        (v) => { const room = r.room; A.vacateResident(r.id, v.day); UI.toast(`Room ${room} is now free from ${D.fmt(v.day)}`); },
        { intro: `Room ${r.room} becomes unoccupied from this date and the move is added to their occupancy history.`, danger: true });
    },
    addRemark: (el) => { const inp = document.getElementById("remark-input"); if (!inp.value.trim()) return inp.focus(); A.addRemark(el.dataset.id, inp.value.trim()); render(); UI.toast("Remark added"); },

    // bookings
    bookTab: (el) => { ui.book.tab = el.dataset.tab; render(); },
    toggleBookSearch: () => { ui.book.searchOpen = true; render(); },
    bookQ: (el) => { ui.book.q = el.value; render(); },
    toggleBookSort: () => { ui.book.sortAsc = !ui.book.sortAsc; render(); UI.toast(ui.book.sortAsc ? "Oldest requests first" : "Newest requests first"); },
    viewBooking: (el) => openDialog({ type: "booking", id: el.dataset.id }),
    acceptBooking: (el) => {
      A.acceptBooking(el.dataset.id); closeDialog();
      UI.toast("Request accepted. Rooms still need allotting.", { act: "allotFromBooking", label: "Allot now", data: `data-id="${el.dataset.id}"` });
    },
    rejectBooking: (el) => {
      const b = S.booking(el.dataset.id);
      form("Reject request from " + b.requestedBy + "?", `<label class="field"><span>Reason (sent to the requester)</span><textarea class="input" name="reason" rows="3" placeholder="e.g. No rooms free on these dates"></textarea></label>`, "Reject request",
        (v) => { if (!v.reason.trim()) return "Add a reason so the requester knows what to change."; A.rejectBooking(b.id, v.reason.trim()); UI.toast("Request rejected"); }, { danger: true });
    },
    allotFromBooking: (el) => {
      const b = S.booking(el.dataset.id);
      ui.map.focusBooking = b.id;
      // open the floor with the most free rooms on the arrival date
      let best = 1, bestN = -1;
      for (const f of HMS.floorplan.FLOORS) { const n = HMS.floorplan.SLOTS.filter((s) => S.roomState(HMS.floorplan.roomNo(f, s.idx), b.from) === "empty").length; if (n > bestN) { best = f; bestN = n; } }
      ui.day = b.from; ui.map.show = { allotted: true, empty: true, guest: true, maintenance: true };
      closeDialog(); go("#/map?floor=" + best);
      UI.toast(`Showing ${D.fmt(b.from)}. Click an unoccupied room to allot ${b.title}.`);
    },
    newBooking: () => openDialog({ type: "book", tab: "book", guests: [], from: ui.day, to: D.add(ui.day, 2), comments: "" }),
    bookDraftTab: (el) => { saveDraftFields(); dlg.tab = el.dataset.tab; renderDialog(); },
    draftAddGuest: (el) => { const v = el.value.trim(); if (!v) return; saveDraftFields(); dlg.guests.push({ name: v, on: true }); el.value = ""; renderDialog(); document.getElementById("draft-guest")?.focus(); },
    draftToggle: (el) => { dlg.guests[Number(el.dataset.i)].on = el.checked; saveDraftFields(); renderDialog(); },
    draftSubmit: () => {
      saveDraftFields();
      const guests = dlg.guests.filter((g) => g.on);
      if (dlg.to < dlg.from) return UI.toast("Departure can't be before arrival.");
      const b = A.createBooking({ guests, from: dlg.from, to: dlg.to, comments: dlg.comments });
      closeDialog();
      UI.toast(`Booked ${guests.length} guest${guests.length > 1 ? "s" : ""}. Rooms still need allotting.`, { act: "allotFromBooking", label: "Allot now", data: `data-id="${b.id}"` });
    },
    draftNotify: () => { const to = document.getElementById("draft-notify-to").value, msg = document.getElementById("draft-notify-msg").value.trim(); if (!msg) return UI.toast("Write a message first."); A.notify(to, msg); closeDialog(); UI.toast("Sent to " + to); },

    // map
    openRoom: (el) => openRoom(el.dataset.room),
    setWing: (el) => { ui.map.wing = el.value; render(); },
    toggleLabels: (el) => { ui.map.labels = el.checked; render(); },
    floorStep: (el) => { const F = HMS.floorplan.FLOORS; const i = F.indexOf(ui.map.floor) + Number(el.dataset.d); if (F[i]) { ui.map.floor = F[i]; render(); } },
    setFloor: (el) => { ui.map.floor = Number(el.dataset.f); render(); },
    toggleLegend: (el) => { const k = el.dataset.k; ui.map.show[k] = !ui.map.show[k]; render(); },
    roomTab: (el) => { dlg.tab = el.dataset.tab; renderDialog(); },
    allotQ: (el) => { dlg.q = el.value; renderDialog(); },
    pickGuest: (el) => { dlg.picked.push(el.dataset.id); dlg.q = ""; renderDialog(); },
    pickResident: (el) => { dlg.resident = el.dataset.id; dlg.q = ""; renderDialog(); },
    pickWalkIn: (el) => { dlg.walkIn = el.dataset.id; dlg.q = ""; renderDialog(); },
    unpickResident: () => { dlg.resident = null; renderDialog(); },
    unpickWalkIn: () => { dlg.walkIn = null; renderDialog(); },
    walkInDays: (el) => { dlg.walkInDays = Math.max(1, Number(el.value) || 1); renderDialog(); },
    showAllWaiting: () => { dlg.showAll = true; renderDialog(); },
    toggleCand: (el) => { const id = el.dataset.id; dlg.picked = el.checked ? [...new Set([...dlg.picked, id])] : dlg.picked.filter((x) => x !== id); renderDialog(); },
    confirmAllot: () => {
      const { room } = dlg; const names = [];
      if (dlg.picked.length) { A.allotGuests(room, dlg.picked); names.push(...dlg.picked.map((id) => S.guest(id).name)); }
      if (dlg.resident) { A.allotResident(room, dlg.resident, ui.day); names.push(S.resident(dlg.resident).name); }
      if (dlg.walkIn) { A.addWalkInGuest(room, dlg.walkIn, ui.day, D.add(ui.day, dlg.walkInDays - 1)); names.push(dlg.walkIn); }
      const fb = ui.map.focusBooking;
      const left = fb ? S.unhousedGuests().filter((p) => p.booking.id === fb).length : 0;
      if (fb && !left) ui.map.focusBooking = null;
      closeDialog();
      UI.toast(`Room ${room} allotted to ${names.join(", ")}.${left ? ` ${left} more from this request to go.` : ""}`);
    },
    setMaintenancePrompt: () => {
      const room = dlg.room;
      form("Mark room " + room + " for repair", `<label class="field"><span>What needs fixing?</span><textarea class="input" name="note" rows="3" placeholder="e.g. Ceiling fan not working"></textarea></label>`, "Mark for repair",
        (v) => { if (!v.note.trim()) return "Describe the repair so the maintenance cell knows."; A.setMaintenance(room, v.note.trim(), ui.day); UI.toast("Room " + room + " marked under repair"); });
    },
    clearMaintenance: (el) => { A.clearMaintenance(el.dataset.room, ui.day); closeDialog(); UI.toast("Room " + el.dataset.room + " is back in use"); },
    sendNotify: (el) => { const to = document.getElementById("notify-to").value, msg = document.getElementById("notify-msg").value.trim(); A.notify(to, msg, el.dataset.room); closeDialog(); UI.toast("Sent to " + to); },
    extendStay: (el) => { dlg.extend = dlg.extend === el.dataset.id ? null : el.dataset.id; renderDialog(); },
    confirmExtend: (el) => { const to = document.getElementById("extend-to").value; A.extendStay(el.dataset.id, to); dlg.extend = null; renderDialog(); render(); UI.toast("Stay extended to " + D.fmt(to)); },
    checkOut: (el) => { A.checkOutStay(el.dataset.id, D.add(ui.day, 1)); closeDialog(); UI.toast("Checked out. Room frees up tomorrow."); },
    roomAddMore: () => { const room = dlg.room; UI.close(true); dlg = null; openDialog({ type: "allot", room, tab: "allot", picked: [], focusBooking: null, q: "", resident: null, walkIn: null, walkInDays: 2, showAll: true }); },

    // forms, settings, demo
    submitForm: () => {
      const vals = Object.fromEntries([...document.querySelectorAll(".layer [name]")].map((i) => [i.name, i.value]));
      const err = dlg.onSubmit(vals);
      if (typeof err === "string") { UI.toast(err); return; }
      closeDialog();
    },
    setLang: (el) => { A.setSetting("lang", el.dataset.v); render(); },
    resetDemo: () => form("Reset demo data?", "", "Reset everything", () => { HMS.store.reset(); ui.map.focusBooking = null; UI.toast("Demo data reset"); }, { intro: "Every room, request, resident edit and saved tab goes back to the starting state.", danger: true }),
  };

  function saveDraftFields() {
    const f = (id) => document.getElementById(id);
    if (f("draft-from")) dlg.from = f("draft-from").value;
    if (f("draft-to")) dlg.to = f("draft-to").value;
    if (f("draft-comments")) dlg.comments = f("draft-comments").value;
  }
  function copyCsv(rows, cols, what) {
    const text = UI.csv(rows, cols);
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
      () => UI.toast(`Copied ${what} as CSV. Paste into Sheets or Excel.`),
      () => UI.toast("Couldn't reach the clipboard in this browser."));
  }

  /* ------------------------------ Delegation ------------------------------ */
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) { if (ui.pop && !e.target.closest(".popover")) { ui.pop = null; render(); } if (ui.res.filterOpen && !e.target.closest(".filter-pop")) { ui.res.filterOpen = false; render(); } return; }
    if (el.dataset.selfOnly && e.target !== el) return;
    if (el.disabled) return;
    const fn = H[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener("input", (e) => { const n = e.target.dataset && e.target.dataset.onInput; if (n && H[n]) H[n](e.target, e); });
  document.addEventListener("change", (e) => { const n = e.target.dataset && e.target.dataset.onChange; if (n && H[n]) H[n](e.target, e); });
  document.addEventListener("keydown", (e) => {
    const t = e.target;
    if (e.key === "Escape") { if (UI.isOpen()) closeDialog(); else if (ui.pop || ui.res.filterOpen) { ui.pop = null; ui.res.filterOpen = false; render(); } return; }
    if (e.key === "Enter" && t.dataset && t.dataset.onEnter) { e.preventDefault(); H[t.dataset.onEnter](t, e); return; }
    if ((e.key === "Enter" || e.key === " ") && t.getAttribute && t.getAttribute("role") === "button" && t.dataset.act) { e.preventDefault(); H[t.dataset.act](t, e); }
  });
  window.addEventListener("hashchange", onRoute);

  /* --------------------------------- Boot --------------------------------- */
  HMS.app = { ui, H, go, render, get dlg() { return dlg; } };  // exposed for tests / console poking
  onRoute();
})();

</script>
</body>
</html>
