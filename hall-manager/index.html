/* ==========================================================================
   Design tokens — extracted from Figma "HM Intern Work" (W8pJfHJeop1TZinVuB2IP1),
   section "Hostel Manager" (238:3312). Variable names mirror the Figma variables.
   If you change a value here, change it in Figma too (or vice versa).
   ========================================================================== */
:root {
  /* Surfaces */
  --primary-bg: #f5f9f8;        /* panels, map floor, cards-in-cards */
  --secondary-bg: #ffffff;      /* page + cards */
  --white: #ffffff;

  /* Brand */
  --primary-cta-bg: #019487;    /* active nav pill, primary button, links */
  --primary-cta-hover: #017d72;
  --colored-subheading: #57b8ab;/* "Hostel Management" wordmark */
  --badge-type1: #b8eae2;       /* Day / Month / Year pills */
  --badge-1: #103d37;           /* text on badge-type1 */

  /* Text */
  --heading: #000000;
  --body: #1e1f24;
  --body-2: #80828d;            /* labels ("Total Rooms") */
  --unselected-text: #80828d;
  --grey-subheading: #36363c;
  --nav-text: #1f1f1f;          /* Figma var "500" */

  /* Strokes */
  --secondary-cta-border: #b9bbc6; /* card + table outlines, secondary button */
  --light-stroke: #e0e1e6;         /* nav pills, dividers */

  /* Hostel map room states (Bookings 1 · 238:5393) */
  --room-empty-bg: #f5f9f8;     --room-empty-stroke: #019487;
  --room-allotted-bg: #8eddd6;  --room-allotted-stroke: #00b1a1;
  --room-guest-bg: #ffffff;     --room-guest-stroke: #57b8ab;   /* legend "Guests" */
  --room-maint-bg: #ffab9a;     --room-maint-stroke: #ff8787;
  --room-common-bg: #d0ede6;    /* stairs / pantry / washroom blocks */
  --room-service-bg: #cecece;   /* service / lift block */

  /* Feedback (not in Figma yet — added for states the designs don't cover) */
  --danger: #c2410c;
  --danger-bg: #fff1ec;
  --warning-bg: #fff7e0;
  --warning: #8a5a00;
  --info: #2563eb;              /* "Occupied" status badge in profile (293:10380) */
  --info-bg: #eef4ff;

  /* Type
     Figma uses Satoshi (UI) + Roboto (numbers/table data, M3 "display-medium").
     Satoshi is served by Fontshare; DM Sans is the fallback when it can't load. */
  --font-ui: "Satoshi", "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "Roboto", ui-sans-serif, system-ui, sans-serif;
  --tracking: -0.3px;

  --fs-display: 45px;   /* stat numbers (M3 display-medium) */
  --fs-stat-sm: 24px;   /* secondary stats */
  --fs-h1: 24px;        /* page titles "Residents", "Requests" */
  --fs-h2: 20px;        /* "Hostel 17," */
  --fs-h3: 16px;        /* H3/M, H3/B — nav, panel titles */
  --fs-body1: 12px;     /* Body1/M */
  --fs-body2: 10px;     /* Body2/M — meta lines */
  --fs-micro: 8px;      /* "Details" links */

  /* Shape */
  --r-card: 12px;
  --r-pill: 24px;
  --r-btn: 6px;
  --r-room: 4.8px;

  /* Layout */
  --sidebar-w: 189px;
  --gutter: 32px;
  --shadow-card: 0 2px 10px rgba(16, 61, 55, 0.08);
  --shadow-pop: 0 12px 40px rgba(16, 61, 55, 0.16);
}

</style>

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {

/* ==========================================================================

.main { padding: 8px 56px 64px 0; min-width: 0; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; min-height: 36px; }
.page-title { font-family: var(--font-data); font-weight: 500; font-size: var(--fs-h1); letter-spacing: 0; margin: 0; }

.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: var(--body-2); font-size: var(--fs-body1); margin-bottom: 10px; }
.back:hover { color: var(--body); }

/* ==========================================================================
   Primitives
   ========================================================================== */
.card { background: var(--secondary-bg); border: 1px solid var(--secondary-cta-border); border-radius: var(--r-card); }
.panel { background: var(--primary-bg); border: 2px solid var(--light-stroke); border-radius: var(--r-card); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 14px; border-radius: var(--r-btn); font-size: var(--fs-body1); border: 1px solid transparent; white-space: nowrap; }

.btn-outline-pill:hover { border-color: var(--primary-cta-bg); color: var(--primary-cta-bg); }

.pill-select { position: relative; display: inline-flex; align-items: center; height: 28px; border-radius: var(--r-pill); background: var(--badge-type1); color: var(--badge-1); font-size: var(--fs-body1); }

.box-select svg { position: absolute; right: 14px; font-size: 16px; pointer-events: none; color: var(--grey-subheading); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: var(--fs-body2); color: var(--body-2); }
.input, .select-input, textarea.input {
  height: 32px; border-radius: 8px; border: 1px solid var(--secondary-cta-border); background: #f9f9fb; padding: 0 12px; font-size: var(--fs-body1);
}
textarea.input { height: auto; padding: 8px 12px; resize: vertical; min-height: 64px; }
.input:focus, .select-input:focus { outline: none; border-color: var(--primary-cta-bg); background: #fff; }
.search { position: relative; display: flex; align-items: center; }
.search svg { position: absolute; left: 11px; font-size: 14px; color: var(--body-2); }
.search .input { padding-left: 32px; width: 188px; }

.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-info { color: var(--info); border-color: var(--info); background: var(--info-bg); }
.badge-teal { color: var(--primary-cta-bg); border-color: var(--primary-cta-bg); background: #eaf7f4; }
.badge-warn { color: var(--warning); border-color: #e7c36a; background: var(--warning-bg); }
.badge-grey { color: var(--body-2); border-color: var(--secondary-cta-border); background: #f9f9fb; }

.kv { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.kv dd { margin: 0; font-family: var(--font-data); letter-spacing: 0; font-weight: 500; font-size: 13px; color: var(--body); }

.checkbox { appearance: none; width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--secondary-cta-border); background: #fff; display: inline-grid; place-items: center; cursor: pointer; margin: 0; }

/* ==========================================================================

.popover { position: absolute; z-index: 40; background: #fff; border: 1px solid var(--light-stroke); border-radius: var(--r-card); box-shadow: var(--shadow-pop); }

.toast { background: var(--body); color: #fff; border-radius: 10px; padding: 10px 14px 10px 16px; font-size: 13px; display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow-pop); animation: toast-in .18s ease-out; }
.toast .link { color: var(--badge-type1); }

   ========================================================================== */

.filter-row input { background: #eeeff2; border-color: #eeeff2; }

.filter-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 18px 0; }

.table-wrap { overflow-x: auto; }

/* Date helpers — ISO yyyy-mm-dd strings, local time, no timezone math. */
window.HMS = window.HMS || {};

HMS.date = {
  add(iso, days) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + days); return HMS.date.iso(d); },
  iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); },
  max(a, b) { return a > b ? a : b; },
  days(from, to) { return Math.round((new Date(to + "T00:00:00") - new Date(from + "T00:00:00")) / 864e5); },
  fmt(iso) { if (!iso) return "—"; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; },
  fmtShort(iso) { if (!iso) return "—"; const d = new Date(iso + "T00:00:00"); return d.getDate() + " " + d.toLocaleString("en-GB", { month: "short" }) + " " + d.getFullYear(); },
  overlaps(from, to, day) { return from <= day && (to == null || to >= day); },
};

  <script>
/* ==========================================================================
   Hostel 17 typical floor — geometry lifted from Figma node 238:5420
   ("Frame 2491" inside "Bookings 1", 238:5393). Units are Figma px inside
   the 806 × 780 frame, so the SVG viewBox can use them directly.

   Each group is a straight run of rooms. `dir: "v"` stacks downward,
   `dir: "h"` runs rightward. `reverse: true` numbers the run from the far
   end so numbering goes clockwise around the building.

   Wings are a proposal: the Figma "Wing A" dropdown exists but wings are not
   drawn yet. A = west, B = north + north-east, C = east + south, D = inner
   ring around the courtyard. Confirm with the Hall Manager before relying on it.
   ========================================================================== */
window.HMS = window.HMS || {};

HMS.floorplan = (function () {
  const GAP = 2.9;
  const V = { w: 44.46, h: 29 };   // room in a vertical run
  const H = { w: 29, h: 44.46 };   // room in a horizontal run

  const groups = [
    // Wing A — west
    { id: "T1", wing: "A", dir: "v", x: 132.42, y: 19.33, n: 2 },
    { id: "L1", wing: "A", dir: "v", x: 19.33, y: 19.33, n: 8 },
    { id: "L2", wing: "A", dir: "v", x: 19.33, y: 344.1, n: 4 },
    { id: "L3", wing: "A", dir: "v", x: 19.33, y: 521.96, n: 4 },
    { id: "L4", wing: "A", dir: "v", x: 20.3, y: 653.41, n: 1 },
    // Wing B — north
    { id: "T2", wing: "B", dir: "h", x: 265.81, y: 19.33, n: 13 },
    { id: "R1", wing: "B", dir: "v", x: 748.14, y: 19.33, n: 9 },
    // Wing C — east + south
    { id: "R2", wing: "C", dir: "v", x: 748.14, y: 435.93, n: 4 },
    { id: "R3", wing: "C", dir: "h", x: 699.81, y: 624.41, n: 3, hh: 45.43 },
    { id: "B1", wing: "C", dir: "h", x: 196.22, y: 629.25, n: 13, reverse: true },
    // Wing D — inner ring
    { id: "IT", wing: "D", dir: "h", x: 255.18, y: 148.85, n: 11 },
    { id: "IR", wing: "D", dir: "v", x: 614.75, y: 201.05, n: 9 },
    { id: "IB", wing: "D", dir: "h", x: 255.18, y: 504.56, n: 11, reverse: true },
    { id: "IL", wing: "D", dir: "v", x: 199.12, y: 193.32, n: 9, reverse: true },
  ];

  // Non-bookable blocks drawn on the plan (labels are a guess — confirm on site)
  const blocks = [
    { x: 20.3, y: 275.48, w: 44.46, h: 63.8, kind: "common", label: "Pantry" },
    { x: 749.1, y: 367.3, w: 44.46, h: 63.8, kind: "common", label: "Washroom" },
    { x: 187.52, y: 19.33, w: 67.66, h: 55.1, kind: "common", label: "Stairs" },
    { x: 194.28, y: 486.19, w: 54.13, h: 55.1, kind: "common", label: "Stairs" },
    { x: 609.92, y: 493.92, w: 54.13, h: 55.1, kind: "common", label: "Stairs" },
    { x: 24.16, y: 699.81, w: 172.05, h: 63.8, kind: "service", label: "Service" },
  ];

  const courtyard = { x: 248.32, y: 204.92, w: 354.74, h: 289.01 };

  // Outline = union of (0,0,805,687) and (0,527,208,252), rounded
  const outline =
    "M12 0 H793 Q805 0 805 12 V675 Q805 687 793 687 H222 Q208 687 208 701 V767 Q208 779 196 779 H12 Q0 779 0 767 V12 Q0 0 12 0 Z";

  /** Build the list of room slots for one floor. Index is 1-based and
      clockwise, so floor 3 slot 5 → room "3005". */
  function slots() {
    const out = [];
    let idx = 1;
    for (const g of groups) {
      const size = g.dir === "v" ? V : { w: H.w, h: g.hh || H.h };
      const cells = [];
      for (let i = 0; i < g.n; i++) {
        const x = g.dir === "h" ? g.x + i * (size.w + GAP) : g.x;
        const y = g.dir === "v" ? g.y + i * (size.h + GAP) : g.y;
        cells.push({ x, y, w: size.w, h: size.h });
      }
      if (g.reverse) cells.reverse();
      for (const c of cells) out.push({ ...c, idx: idx++, group: g.id, wing: g.wing });
    }
    return out;
  }

  const SLOTS = slots();
  const FLOORS = [1, 2, 3, 4, 5, 6];
  const WINGS = ["A", "B", "C", "D"];

  function roomNo(floor, idx) {
    return String(floor) + String(idx).padStart(3, "0");
  }
  function parseRoom(no) {
    const s = String(no);
    return { floor: Number(s.slice(0, -3)), idx: Number(s.slice(-3)) };
  }
  function wingOf(no) {
    const { idx } = parseRoom(no);
    const slot = SLOTS[idx - 1];
    return slot ? slot.wing : null;
  }
  function allRooms() {
    const out = [];
    for (const f of FLOORS) for (const s of SLOTS) out.push(roomNo(f, s.idx));
    return out;
  }

  return { SLOTS, FLOORS, WINGS, blocks, courtyard, outline, roomNo, parseRoom, wingOf, allRooms, viewBox: "0 0 806 780" };
})();

  // 2. Fill ~50% of rooms with residents
  for (const room of rooms) {
    if (taken.has(room)) continue;
    const { idx } = fp.parseRoom(room);
    if (idx === 19) continue;          // L4 corner room — kept for maintenance
    if (rnd() < 0.49) {
      const res = makeResident();
      residents.push(res);
      const from = D.max(res.joined, "2025-07-15");
      if (res.joined < "2025-07-15" && rnd() < .5) {
        const oldRoom = fp.roomNo(1 + Math.floor(rnd() * 6), 1 + Math.floor(rnd() * 101));
        res.history.push({ type: "vacated", room: oldRoom, date: "2025-05-12" }, { type: "allotted", room: oldRoom, date: res.joined });
      }
      place(res, room, from);
    }
  }

  // 3. Maintenance — corner room on every floor + a few random
  for (const f of fp.FLOORS) {
    const room = fp.roomNo(f, 19);
    maintenance.push({ id: "MT-" + f, room, from: "2026-09-10", to: null, note: pick(["Seepage on west wall","Window latch broken","Ceiling fan replacement","Bathroom tap leaking"]), reportedBy: "Hall Manager" });
    taken.add(room);
  }
  for (const room of ["2044", "5071", "3088"]) {
    if (taken.has(room)) continue;
    maintenance.push({ id: "MT-" + room, room, from: "2026-09-18", to: "2026-09-28", note: "Repainting after vacate", reportedBy: "Hall Manager" });

  const freeRooms = () => rooms.filter((r) => !taken.has(r));

  function mkGuest(name, contact, bookingId, relation) {

  }
  function guestStay(g, room, from, to) {
    taken.add(room);

  }

  // 4. Bookings — mirror the dashboard + requests screens

  // In-house now (dashboard "Guests" list)
  {
    const id = bid();
    const b = { id, kind: "individual", source: "student", requestedBy: residents[3].name, requesterRoll: residents[3].roll, title: "Sakshi Tawde", count: 1, from: "2026-09-20", to: "2026-09-25", requestedOn: "2026-09-12", contact: phone(), comments: "Cousin visiting for campus placement interviews.", status: "allotted", guestIds: [] };

    const room = "3007"; if (!taken.has(room)) guestStay(g, room, b.from, b.to); else guestStay(g, freeOnFloor(3)[0], b.from, b.to);
  }
  {
    const id = bid();
    const b = { id, kind: "group", source: "department", requestedBy: "IDC Office", title: "Student guests : 7", count: 7, from: "2026-09-18", to: "2026-09-30", requestedOn: "2026-09-05", contact: phone(), comments: "Exchange students from TU Delft for the Design Studio workshop.", status: "allotted", guestIds: [] };
    const floor2 = freeOnFloor(2).slice(0, 7);
    for (let i = 0; i < 7; i++) { const g = mkGuest(pick(FIRST) + " " + pick(["de Vries","Jansen","Bakker","Visser","Smit","Meijer","Mulder"]), null, id, "Exchange student"); b.guestIds.push(g.id); guestStay(g, floor2[i], b.from, b.to); }
    bookings.push(b);
  }
  {
    const id = bid();
    const host = residents.find((r) => r.name.startsWith("Kamika")) || residents[8];
    host.name = "Kamika Chauhan";
    const b = { id, kind: "individual", source: "student", requestedBy: host.name, requesterRoll: host.roll, title: "Kamika Chauhan Parents", count: 2, from: "2026-09-21", to: "2026-09-24", requestedOn: "2026-09-10", contact: phone(), comments: "Parents visiting for convocation.", status: "allotted", guestIds: [] };
    const room = freeOnFloor(3).find((r) => r > "3008") || freeOnFloor(3)[0];
    for (const n of ["Rajesh Chauhan", "Sunita Chauhan"]) { const g = mkGuest(n, b.contact, id, "Parent"); b.guestIds.push(g.id); guestStay(g, room, b.from, b.to); }
    bookings.push(b);
  }
  // Checking out today (dashboard "Today check out")
  for (let i = 0; i < 4; i++) {
    const id = bid(); const host = studentFor();
    const b = { id, kind: "individual", source: "student", requestedBy: host.name, requesterRoll: host.roll, title: host.name, count: 1, from: "2026-09-19", to: HMS.TODAY, requestedOn: "2026-09-08", contact: phone(), comments: pick(["Sister visiting.","Mother visiting for medical appointment.","Friend attending Techfest planning meet."]), status: "allotted", guestIds: [] };
    const g = mkGuest(pick(FIRST) + " " + host.name.split(" ")[1], b.contact, id, pick(["Sister","Mother","Friend"]));
    b.guestIds.push(g.id); guestStay(g, freeOnFloor(4 + (i % 2))[i], b.from, b.to); bookings.push(b);
  }
  // Checking in today
  {
    const id = bid();
    const b = { id, kind: "group", source: "hcu", requestedBy: "HCU Office", title: "Interview candidates", count: 5, from: HMS.TODAY, to: "2026-09-26", requestedOn: "2026-09-15", contact: phone(), comments: "M.Des admission interview candidates. Routed by HCU after Dean SA approval.", status: "allotted", guestIds: [] };
    const fl = freeOnFloor(5);
    for (let i = 0; i < 5; i++) { const g = mkGuest(pick(FIRST) + " " + pick(LAST), null, id, "Candidate"); b.guestIds.push(g.id); guestStay(g, fl[i], b.from, b.to); }
    bookings.push(b);
  }
  // Other in-house guests to reach ~35
  for (let i = 0; i < 9; i++) {
    const id = bid(); const host = studentFor();
    const from = D.add(HMS.TODAY, -Math.floor(rnd() * 5) - 1); const to = D.add(HMS.TODAY, Math.floor(rnd() * 6) + 1);
    const n = rnd() < .35 ? 2 : 1;
    const b = { id, kind: "individual", source: "student", requestedBy: host.name, requesterRoll: host.roll, title: n === 2 ? host.name.split(" ")[0] + " " + host.name.split(" ")[1] + " Parents" : host.name, count: n, from, to, requestedOn: D.add(from, -8), contact: phone(), comments: pick(["Parents visiting.","Parents visiting for convocation.","Sister visiting over the weekend."]), status: "allotted", guestIds: [] };
    const room = freeOnFloor(1 + (i % 6))[2];
    for (let k = 0; k < n; k++) { const g = mkGuest(pick(FIRST) + " " + host.name.split(" ")[1], b.contact, id, n === 2 ? "Parent" : "Sister"); b.guestIds.push(g.id); guestStay(g, room, from, to); }
    bookings.push(b);
  }

  // Pending — show up on Requests + Updates
  const pending = [
    { kind: "group", source: "department", requestedBy: "IDC Office", title: "20 females", count: 20, from: "2026-10-12", to: "2026-10-16", requestedOn: "2026-09-21", comments: "IDC Design Symposium speakers and student volunteers from partner institutes. Dean SA approved on 19/09." },
    { kind: "group", source: "hcu", requestedBy: "HCU Office", title: "Interview students accommodation", count: 15, from: "2026-10-05", to: "2026-10-08", requestedOn: "2026-09-22", comments: "PhD interview candidates (Chemistry). Female candidates only; routed by HCU." },
    { kind: "group", source: "department", requestedBy: "IRCC", title: "Winter research interns", count: 6, from: "2026-12-01", to: "2026-12-31", requestedOn: "2026-09-19", comments: "IRCC internship programme. List attached by IRCC." },
  ];
  for (const p of pending) {
    const id = bid();
    const b = { id, ...p, contact: phone(), status: "pending", guestIds: [] };
    for (let i = 0; i < p.count; i++) b.guestIds.push(mkGuest(pick(FIRST) + " " + pick(LAST), null, id, p.source === "hcu" ? "Candidate" : "Delegate").id);
    bookings.push(b);
  }
  for (let i = 0; i < 9; i++) {
    const id = bid(); const host = studentFor();
    const from = D.add(HMS.TODAY, 3 + Math.floor(rnd() * 20)); const days = 2 + Math.floor(rnd() * 4);
    const n = rnd() < .3 ? 2 : 1;
    const b = { id, kind: "individual", source: "student", requestedBy: host.name, requesterRoll: host.roll, title: host.name, count: n, from, to: D.add(from, days), requestedOn: D.add(HMS.TODAY, -Math.floor(rnd() * 4)), contact: host.phone, comments: pick(["Parents visiting for Diwali break.","Mother visiting for a medical check-up in Powai.","Sister coming for Mood Indigo.","Parents attending Institute Day."]), status: i < 2 ? "accepted" : "pending", guestIds: [] };
    for (let k = 0; k < n; k++) b.guestIds.push(mkGuest(pick(FIRST) + " " + host.name.split(" ")[1], b.contact, id, n === 2 ? "Parent" : "Mother").id);
    bookings.push(b);
  }
  // Past
  for (let i = 0; i < 6; i++) {
    const id = bid(); const host = studentFor();
    const from = D.add(HMS.TODAY, -40 + i * 5); const to = D.add(from, 3);
    const b = { id, kind: i === 0 ? "group" : "individual", source: i === 0 ? "department" : "student", requestedBy: i === 0 ? "EE Office" : host.name, requesterRoll: i === 0 ? undefined : host.roll, title: i === 0 ? "VLSI workshop speakers" : host.name, count: i === 0 ? 4 : 1, from, to, requestedOn: D.add(from, -10), contact: phone(), comments: i === 5 ? "Dates clash with room repainting." : "Completed.", status: i === 5 ? "rejected" : "completed", guestIds: [] };
    bookings.push(b);
  }

  // 5. Updates — the notification feed (Group 45 · 301:1609)
  const pendingHcu = bookings.find((b) => b.source === "hcu" && b.status === "pending");
  const sakshi = bookings[0];
  updates.push(
    { id: "UP-1", type: "booking", bookingId: pendingHcu.id, title: "Interview students accommodation request", body: "HCU | " + pendingHcu.count + " students", from: pendingHcu.from, to: pendingHcu.to, state: "open" },
    { id: "UP-2", type: "extension", bookingId: sakshi.id, title: "Extension request · Sakshi Tawde", body: "Requested by " + sakshi.requestedBy + ". Stay until 27/09 instead of 25/09.", from: sakshi.from, to: "2026-09-27", state: "open" },
    { id: "UP-3", type: "leave", residentId: residents[12].id, title: "Leave notice · " + residents[12].name, body: "Going home for Navratri. Room " + residents[12].room + " stays retained.", from: "2026-09-26", to: "2026-10-04", state: "open" },
    { id: "UP-4", type: "maintenance", room: "4031", title: "Repair reported · Room 4031", body: "Resident reports a broken window latch. Mark the room under maintenance?", from: HMS.TODAY, to: null, state: "open" },
  );

  return { residents, guests, stays, maintenance, bookings, updates, customTabs: [], settings: { lang: "en", hostel: "Hostel 17" } };
};

  <script>
/* ==========================================================================
   Store — the only place that reads or writes data.
   Views call selectors (read) and mutations (write), never touch `state`.
   To move to a backend, keep these function signatures and swap the bodies
   for API calls.
   ========================================================================== */
window.HMS = window.HMS || {};

HMS.store = (function () {
  const KEY = "iitb-hms-hall-manager-v1";
  let state = load();
  const listeners = new Set();

  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) { /* storage blocked */ }
    return HMS.seed();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }
  function commit() { save(); listeners.forEach((fn) => fn()); }
  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  function reset() { state = HMS.seed(); commit(); }

  const byId = (list, id) => list.find((x) => x.id === id);
  const D = HMS.date;
  let uid = Date.now() % 100000;
  const nid = (p) => p + "-" + (uid++).toString(36);

  /* ------------------------------ Selectors ------------------------------ */
  const sel = {
    raw: () => state,
    resident: (id) => byId(state.residents, id),
    residentByRoom: (room) => state.residents.find((r) => r.room === room),
    guest: (id) => byId(state.guests, id),
    booking: (id) => byId(state.bookings, id),
    bookings: () => state.bookings,
    updates: () => state.updates,
    customTabs: () => state.customTabs,
    settings: () => state.settings,

    /** Stays active on `day` in `room` */
    staysIn(room, day) { return state.stays.filter((s) => s.room === room && D.overlaps(s.from, s.to, day)); },
    maintenanceIn(room, day) { return state.maintenance.find((m) => m.room === room && D.overlaps(m.from, m.to, day)); },

    /** One of: "allotted" | "guest" | "maintenance" | "empty" */
    roomState(room, day) {
      if (sel.maintenanceIn(room, day)) return "maintenance";
      const st = sel.staysIn(room, day);
      if (!st.length) return "empty";
      return st.some((s) => s.kind === "resident") ? "allotted" : "guest";
    },

    occupants(room, day) {
      return sel.staysIn(room, day).map((s) => ({ stay: s, person: s.kind === "resident" ? sel.resident(s.personId) : sel.guest(s.personId) }));
    },

    stats(day) {
      const rooms = HMS.floorplan.allRooms();
      let empty = 0, allotted = 0, guestRooms = 0, maint = 0;
      for (const r of rooms) {
        const st = sel.roomState(r, day);
        if (st === "empty") empty++; else if (st === "allotted") allotted++; else if (st === "guest") guestRooms++; else maint++;
      }
      const guestStays = state.stays.filter((s) => s.kind === "guest");
      return {
        total: rooms.length, empty, occupied: allotted + guestRooms, allotted, guestRooms, maint,
        guests: guestStays.filter((s) => D.overlaps(s.from, s.to, day)).length,
        checkIns: new Set(guestStays.filter((s) => s.from === day).map((s) => s.room)).size,
        checkOuts: new Set(guestStays.filter((s) => s.to === day).map((s) => s.room)).size,
      };
    },

    /** Guest bookings with at least one guest in-house on `day` */
    inHouseBookings(day) {
      return state.bookings.filter((b) => b.status === "allotted" && sel.bookingStays(b.id).some((s) => D.overlaps(s.from, s.to, day)));
    },
    bookingStays(bookingId) {
      const b = sel.booking(bookingId); if (!b) return [];
      return state.stays.filter((s) => s.kind === "guest" && b.guestIds.includes(s.personId));
    },
    bookingRooms(bookingId) { return [...new Set(sel.bookingStays(bookingId).map((s) => s.room))].sort(); },

    /** Guests still waiting for a room — accepted bookings, guest not yet allotted */
    unhousedGuests() {
      const housed = new Set(state.stays.filter((s) => s.kind === "guest").map((s) => s.personId));
      const out = [];
      for (const b of state.bookings) if (b.status === "accepted") for (const gid of b.guestIds) if (!housed.has(gid)) out.push({ guest: sel.guest(gid), booking: b });
      return out;
    },

    /** Rows for the Residents table; tab = Bachelors | Masters | PhD | Guests */
    residentRows(tab, day) {
      if (tab === "Guests") {
        return state.stays.filter((s) => s.kind === "guest" && D.overlaps(s.from, s.to, day)).map((s) => {
          const g = sel.guest(s.personId); const b = sel.booking(g.bookingId);
          return { kind: "guest", id: g.id, room: s.room, name: g.name, arrival: s.from, departure: s.to, contact: g.contact, requestedBy: b ? b.requestedBy : "", booking: b ? b.id : "" };
        });
      }
      return state.residents.filter((r) => r.room && (!tab || r.programGroup === tab)).map((r) => ({
        kind: "resident", id: r.id, room: r.room, roll: r.roll, name: r.name, dept: r.dept, program: r.degree, contact: r.phone, semester: r.semester, programGroup: r.programGroup,
      }));
    },

    search(q) {
      q = q.trim().toLowerCase(); if (!q) return [];
      const out = [];
      for (const r of state.residents) if (r.room && (r.name.toLowerCase().includes(q) || r.roll.toLowerCase().includes(q) || r.room.includes(q))) out.push({ type: "resident", id: r.id, label: r.name, sub: r.roll + " · Room " + r.room });
      for (const g of state.guests) if (g.name.toLowerCase().includes(q)) { const st = state.stays.find((s) => s.personId === g.id); out.push({ type: "guest", id: g.id, label: g.name, sub: "Guest" + (st ? " · Room " + st.room : " · Not allotted") }); }
      if (/^\d{4}$/.test(q)) out.unshift({ type: "room", id: q, label: "Room " + q, sub: "Open on Hostel map" });
      return out.slice(0, 12);
    },
  };

  /* ------------------------------ Mutations ------------------------------ */
  const act = {
    acceptBooking(id) { const b = sel.booking(id); if (!b) return; b.status = "accepted"; closeUpdatesFor(id, "accepted"); commit(); },
    rejectBooking(id, reason) { const b = sel.booking(id); if (!b) return; b.status = "rejected"; b.rejectReason = reason || ""; closeUpdatesFor(id, "rejected"); commit(); },

    /** Put the given guests into `room` for their booking's dates */
    allotGuests(room, guestIds) {
      for (const gid of guestIds) {
        const g = sel.guest(gid); const b = sel.booking(g.bookingId);
        state.stays.push({ id: nid("ST"), room, kind: "guest", personId: gid, from: b.from, to: b.to });
      }
      for (const b of state.bookings) if (b.status === "accepted" && b.guestIds.every((gid) => state.stays.some((s) => s.personId === gid))) b.status = "allotted";
      commit();
    },

    /** Give an unhoused resident a room (from "Add resident" in the allot dialog) */
    allotResident(room, residentId, from) {
      const r = sel.resident(residentId);
      if (r.room) act.vacateResident(r.id, from, true);
      r.room = room;
      state.stays.push({ id: nid("ST"), room, kind: "resident", personId: r.id, from, to: r.expectedExit });
      r.history.unshift({ type: "allotted", room, date: from });
      commit();
    },

    /** Walk-in / new person typed into "Add resident" — creates a single-person booking */
    addWalkInGuest(room, name, from, to, comments) {
      const id = nid("BK");
      const g = { id: nid("GS"), name, contact: "", bookingId: id, relation: "Walk-in" };
      state.guests.push(g);
      state.bookings.push({ id, kind: "individual", source: "hall-manager", requestedBy: "Hall Manager", title: name, count: 1, from, to, requestedOn: HMS.TODAY, contact: "", comments: comments || "Added directly by Hall Manager.", status: "allotted", guestIds: [g.id] });
      state.stays.push({ id: nid("ST"), room, kind: "guest", personId: g.id, from, to });
      commit();
    },

    extendStay(stayId, to) {
      const s = state.stays.find((x) => x.id === stayId); if (!s) return;
      s.to = to;
      if (s.kind === "guest") { const g = sel.guest(s.personId); const b = sel.booking(g.bookingId); if (b && to > b.to) b.to = to; }
      commit();
    },

    updateBookingDates(id, from, to) {
      const b = sel.booking(id); if (!b) return;
      for (const s of sel.bookingStays(id)) { if (s.from === b.from) s.from = from; if (s.to === b.to) s.to = to; }
      b.from = from; b.to = to;
      commit();
    },

    checkOutStay(stayId, day) {
      const s = state.stays.find((x) => x.id === stayId); if (!s) return;
      s.to = D.add(day, -1) < s.from ? s.from : D.add(day, -1);
      if (s.kind === "guest") state.stays = state.stays.filter((x) => !(x.id === stayId && x.from > x.to));
      commit();
    },

    vacateResident(id, day, silent) {
      const r = sel.resident(id); if (!r || !r.room) return;
      const st = state.stays.find((s) => s.personId === id && s.kind === "resident" && D.overlaps(s.from, s.to, day));
      if (st) st.to = D.add(day, -1) < st.from ? st.from : D.add(day, -1);
      r.history.unshift({ type: "vacated", room: r.room, date: day });
      r.room = null;
      if (!silent) commit();
    },

    setMaintenance(room, note, from) { state.maintenance.push({ id: nid("MT"), room, from, to: null, note, reportedBy: "Hall Manager" }); commit(); },
    clearMaintenance(room, day) { for (const m of state.maintenance) if (m.room === room && D.overlaps(m.from, m.to, day)) m.to = D.add(day, -1) < m.from ? m.from : D.add(day, -1); commit(); },

    updateResident(id, patch) { Object.assign(sel.resident(id), patch); commit(); },
    addRemark(id, text) { sel.resident(id).remarks.unshift({ text, date: HMS.TODAY, by: "Hall Manager" }); commit(); },

    /** Hall Manager books guests on someone's behalf (Book dialog · 306:2388) */
    createBooking(data) {
      const id = nid("BK");
      const b = { id, kind: data.guests.length > 1 ? "group" : "individual", source: "hall-manager", requestedBy: data.requestedBy || "Hall Manager", title: data.guests.length > 1 ? data.guests.length + " guests" : data.guests[0].name, count: data.guests.length, from: data.from, to: data.to, requestedOn: HMS.TODAY, contact: data.guests[0].contact || "", comments: data.comments || "", status: "accepted", guestIds: [] };
      for (const g of data.guests) { const gg = { id: nid("GS"), name: g.name, contact: g.contact || "", bookingId: id, relation: "" }; state.guests.push(gg); b.guestIds.push(gg.id); }
      state.bookings.unshift(b);
      commit();
      return b;
    },

    resolveUpdate(id, accepted) {
      const u = byId(state.updates, id); if (!u) return;
      u.state = accepted ? "accepted" : "rejected";
      if (u.type === "booking") { const b = sel.booking(u.bookingId); if (b) b.status = accepted ? "accepted" : "rejected"; }
      if (u.type === "extension" && accepted) for (const s of sel.bookingStays(u.bookingId)) s.to = u.to;
      if (u.type === "extension" && accepted) { const b = sel.booking(u.bookingId); if (b) b.to = u.to; }
      if (u.type === "maintenance" && accepted) state.maintenance.push({ id: nid("MT"), room: u.room, from: HMS.TODAY, to: null, note: u.body, reportedBy: "Resident" });
      if (u.type === "leave") { const r = sel.resident(u.residentId); if (r) r.remarks.unshift({ text: `On leave ${D.fmt(u.from)} – ${D.fmt(u.to)}. Room retained.`, date: HMS.TODAY, by: "Hall Manager" }); }
      commit();
    },

    notify(to, message, context) { state.updates.push({ id: nid("UP"), type: "sent", title: "Sent to " + to, body: message, context, from: HMS.TODAY, to: null, state: "sent" }); commit(); },

    saveCustomTab(tab) { state.customTabs.push({ id: nid("TAB"), ...tab }); commit(); return state.customTabs[state.customTabs.length - 1]; },
    removeCustomTab(id) { state.customTabs = state.customTabs.filter((t) => t.id !== id); commit(); },
    setSetting(k, v) { state.settings[k] = v; commit(); },
  };

  function closeUpdatesFor(bookingId, to) { for (const u of state.updates) if (u.bookingId === bookingId && u.type === "booking" && u.state === "open") u.state = to; }

  return { sel, act, subscribe, reset };
})();

/* ==========================================================================
   UI helpers — icons, escaping, overlays (modal / drawer / popover), toasts.
   Icons are hand-drawn to match Phosphor "light" (the set used in Figma:
   MagnifyingGlass 90:2742, PencilSimple 90:2175, CaretRight 90:2431,
   GearSix 90:3238). Swap for @phosphor-icons/web when you add a bundler.
   ========================================================================== */
window.HMS = window.HMS || {};

HMS.ui = (function () {
  const P = {
    search: '<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/>',
    bell: '<path d="M6 10a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 16 6 10Z"/><path d="M9.5 20.5a2.6 2.6 0 0 0 5 0"/><path d="M4 4.5 2.8 6M20 4.5 21.2 6"/>',
    gear: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/><circle cx="12" cy="12" r="7"/>',
    pencil: '<path d="M15.5 4.5 19.5 8.5 8.5 19.5H4.5v-4Z"/><path d="M13 7l4 4"/>',
    eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3.2"/>',
    caretRight: '<path d="m9 5 7 7-7 7"/>',
    caretDown: '<path d="m5 9 7 7 7-7"/>',
    caretUp: '<path d="m5 15 7-7 7 7"/>',
    caretLeft: '<path d="m15 5-7 7 7 7"/>',
    check: '<path d="m4.5 12.5 5 5 10-11"/>',
    x: '<path d="M6 6l12 12M18 6 6 18"/>',
    funnel: '<path d="M3.5 5h17l-6.5 8v6l-4-2v-4Z"/>',
    sort: '<path d="M4 6h9M4 12h7M4 18h5"/><path d="M17 5v14M14 16l3 3 3-3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    building: '<rect x="4" y="3.5" width="11" height="17" rx="1"/><path d="M15 9.5h4.5a.5.5 0 0 1 .5.5v10.5M2.5 20.5h19M7.5 7.5h1M11 7.5h1M7.5 11h1M11 11h1M7.5 14.5h1M11 14.5h1M9 20.5v-3h1v3"/>',
    list: '<path d="M10 6h10M10 12h10M10 18h10"/><path d="m3.5 6 1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11"/><path d="M4 18h2.5"/>',
    arrow: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
    download: '<path d="M12 4v11M7 10l5 5 5-5M4.5 19.5h15"/>',
    wrench: '<path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3l7.5-7.5a4 4 0 0 1-2-2Z"/>',
    send: '<path d="M21 3 10 14M21 3l-7 18-4-7-7-4Z"/>',
    door: '<path d="M5 20.5V4a.5.5 0 0 1 .5-.5h13a.5.5 0 0 1 .5.5v16.5M3 20.5h18"/><circle cx="15" cy="12.5" r=".8" fill="currentColor"/>',
  };
  function icon(name, cls) {
    return `<svg class="ic ${cls || ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[name] || ""}</svg>`;
  }

  // IIT Bombay emblem stand-in (the real logo is an image mask in Figma 238:3457)
  const logo = `<svg class="brand-mark" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="20" cy="20" r="17"/><circle cx="20" cy="20" r="11"/>${Array.from({ length: 16 }, (_, i) => { const a = (i / 16) * Math.PI * 2; return `<line x1="${20 + Math.cos(a) * 17}" y1="${20 + Math.sin(a) * 17}" x2="${20 + Math.cos(a) * 19.5}" y2="${20 + Math.sin(a) * 19.5}"/>`; }).join("")}<path d="M14 25h12M15 25v-7M20 25v-9M25 25v-7M13 18h14l-7-4Z"/></svg>`;

  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const kv = (label, value, cls) => `<dl class="kv ${cls || ""}"><dt>${esc(label)}</dt><dd>${value ?? "—"}</dd></dl>`;
  const phoneMask = (p) => (p ? String(p).slice(0, 2) + "XXX XXXXX" : "—");   // mirrors "81XXX XXXXX" in Figma

  /* ---------- Overlays: one layer at a time keeps focus handling simple ---------- */
  let layer = null;
  let lastFocus = null;

  function open(html, { kind = "modal", onClose } = {}) {
    close(true);
    lastFocus = document.activeElement;
    const wrap = document.createElement("div");
    wrap.className = "layer";
    if (kind === "drawer") wrap.innerHTML = `<div class="drawer-scrim" data-act="closeLayer"></div><aside class="drawer" role="dialog" aria-modal="true">${html}</aside>`;
    else wrap.innerHTML = `<div class="scrim" data-act="closeLayer" data-self-only="1"><div class="modal ${kind === "wide" ? "modal-wide" : ""}" role="dialog" aria-modal="true">${html}</div></div>`;
    document.body.appendChild(wrap);
    layer = { el: wrap, onClose };
    const f = wrap.querySelector("[autofocus], input, select, textarea, button:not([data-act=closeLayer])");
    if (f) f.focus();
    return wrap;
  }
  function replace(html) { if (!layer) return; const box = layer.el.querySelector(".modal, .drawer"); box.innerHTML = html; }
  function close(silent) {
    if (!layer) return;
    const { el, onClose } = layer; layer = null; el.remove();
    if (onClose && !silent) onClose();
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  const isOpen = () => !!layer;

  function toast(msg, action) {
    let wrap = document.querySelector(".toast-wrap");
    if (!wrap) { wrap = document.createElement("div"); wrap.className = "toast-wrap"; wrap.setAttribute("role", "status"); document.body.appendChild(wrap); }
    const t = document.createElement("div");
    t.className = "toast";
    t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button class="link" data-act="${action.act}" ${action.data || ""}>${esc(action.label)}</button>` : "");
    wrap.appendChild(t);
    setTimeout(() => t.remove(), action ? 6000 : 3200);
  }

  function csv(rows, cols) {
    const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    return [cols.map((c) => q(c.label)).join(","), ...rows.map((r) => cols.map((c) => q(r[c.key])).join(","))].join("\n");
  }
  function download(name, text) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
    a.download = name; a.click(); URL.revokeObjectURL(a.href);
  }

  return { icon, logo, esc, kv, phoneMask, open, replace, close, isOpen, toast, csv, download };
})();

/* ==========================================================================
   Dashboard — Figma 238:3313 (+ Updates panel 301:1609 placed to its right)
   ========================================================================== */
window.HMS = window.HMS || {};
HMS.views = HMS.views || {};

HMS.views.dashboard = (function () {
  const { icon, esc } = HMS.ui;
  const D = HMS.date;
  const S = HMS.store.sel;

  function datePills(day) {
    const [y, m, d] = day.split("-").map(Number);
    const days = new Date(y, m, 0).getDate();
    const opt = (v, cur, label) => `<option value="${v}" ${v === cur ? "selected" : ""}>${label}</option>`;
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `<div class="pills" role="group" aria-label="Date shown">
      <label class="pill-select"><span class="sr-only">Day</span><select data-on-change="setDatePart" data-part="d">${Array.from({ length: days }, (_, i) => opt(i + 1, d, "Day " + (i + 1))).join("")}</select>${icon("caretDown")}</label>
      <label class="pill-select"><span class="sr-only">Month</span><select data-on-change="setDatePart" data-part="m">${months.map((n, i) => opt(i + 1, m, n)).join("")}</select>${icon("caretDown")}</label>
      <label class="pill-select"><span class="sr-only">Year</span><select data-on-change="setDatePart" data-part="y">${[2025, 2026, 2027].map((v) => opt(v, y, v)).join("")}</select>${icon("caretDown")}</label>
    </div>`;
  }

  function stat(label, value, unit, go, small) {
    return `<div class="stat ${small ? "stat-sm" : ""}">
      <div class="stat-label">${label}</div>
      <div class="stat-value"><b>${value}</b>${unit ? `<small>${unit}</small>` : ""}</div>
      <button class="stat-link" data-act="go" data-href="${go}" aria-label="${label} details">Details ${icon("caretRight")}</button>
    </div>`;
  }

  function guestRows(day, q, sortAsc) {
    let list = S.inHouseBookings(day);
    if (q) list = list.filter((b) => (b.title + " " + b.requestedBy + " " + S.bookingRooms(b.id).join(" ")).toLowerCase().includes(q.toLowerCase()));
    list.sort((a, b) => (sortAsc ? a.from.localeCompare(b.from) : b.from.localeCompare(a.from)));
    if (!list.length) return `<div class="empty"><strong>No guests on ${D.fmt(day)}</strong>Accepted requests appear here once rooms are allotted.</div>`;
    return list.map((b) => {
      const rooms = S.bookingRooms(b.id);
      const roomLabel = rooms.length > 1 ? `${rooms[0]}- ${rooms[rooms.length - 1]}` : rooms[0] || "—";
      const tag = b.to === day ? `<span class="badge badge-warn tag">Leaves today</span>` : b.from === day ? `<span class="badge badge-teal tag">Arrives today</span>` : "";
      return `<div class="guest-row">
        <div class="who"><div class="name">${esc(b.title)}</div><div class="meta">${roomLabel}     |     ${D.fmt(b.from)} - ${D.fmt(b.to)}</div></div>
        ${tag}
        <button class="icon-btn" data-act="editBooking" data-id="${b.id}" aria-label="Edit ${esc(b.title)}">${icon("pencil")}</button>
      </div>`;
    }).join("");
  }

  function updateCard(u) {
    const done = u.state !== "open";
    const dates = u.to ? `${D.fmtShort(u.from).replace(/ \d{4}$/, "")} — ${D.fmtShort(u.to)}` : D.fmtShort(u.from);
    const [yes, no] = { booking: ["Accept", "Reject"], extension: ["Approve", "Decline"], leave: ["Acknowledge", "Dismiss"], maintenance: ["Mark under repair", "Dismiss"] }[u.type] || ["Accept", "Reject"];
    return `<article class="update ${done ? "done" : ""}">
      <h3>${esc(u.title)}</h3>
      <p>${esc(u.body)}</p>
      <div class="when num">${dates}</div>
      ${done
        ? `<span class="resolved">${icon("check")} ${u.state === "accepted" ? "Done" : u.state === "sent" ? "Sent" : "Dismissed"}</span>`
        : `<div class="row">
            <button class="btn btn-secondary" data-act="resolveUpdate" data-id="${u.id}" data-ok="0">${icon("x")} ${no}</button>
            <button class="btn btn-primary" data-act="resolveUpdate" data-id="${u.id}" data-ok="1">${icon("check")} ${yes}</button>
          </div>`}
    </article>`;
  }

  function updatesPanel(q) {
    let list = S.updates().filter((u) => u.type !== "sent");
    if (q) list = list.filter((u) => (u.title + u.body).toLowerCase().includes(q.toLowerCase()));
    list = [...list.filter((u) => u.state === "open"), ...list.filter((u) => u.state !== "open")];
    return list.length ? list.map(updateCard).join("") : `<div class="empty"><strong>Nothing needs you</strong>New requests from students, departments and HCU land here.</div>`;
  }

  function render(ctx) {
    const day = ctx.ui.day;
    const st = S.stats(day);
    const hostel = S.settings().hostel;
    return `<div class="dash" data-figma-node="238:3313">
      <section aria-labelledby="dash-title">
        <div class="dash-head"><h1 id="dash-title">${esc(hostel)},</h1>${datePills(day)}</div>
        <div class="stats">
          ${stat("Total Rooms", st.total, "Rooms", "#/map")}
          ${stat("Empty Rooms", st.empty, "Rooms", "#/map?show=empty")}
          ${stat("Occupied Rooms", st.occupied, "Rooms", "#/residents")}
          ${stat("Guests", st.guests, "", "#/residents?tab=Guests", true)}
          ${stat("Today Check In", st.checkIns, "Rooms", "#/residents?tab=Guests&arriving=1", true)}
          ${stat("Today Check Out", st.checkOuts, "Rooms", "#/residents?tab=Guests&leaving=1", true)}
        </div>
        <div class="panel">
          <div class="panel-head">
            <span class="panel-icon">${icon("building")}</span><h2>Guests</h2>
            <div class="panel-tools">
              <button class="icon-btn" data-act="toggleGuestSearch" aria-label="Search guests">${icon("search")}</button>
              <button class="icon-btn" data-act="toggleGuestSort" aria-label="Sort by arrival">${icon("sort")}</button>
            </div>
          </div>
          ${ctx.ui.guestSearchOpen ? `<div class="panel-search search">${icon("search")}<input class="input" type="search" placeholder="Search guests or rooms" value="${esc(ctx.ui.guestQ)}" data-on-input="guestQ" autofocus></div>` : ""}
          <div class="guest-list" id="guest-list">${guestRows(day, ctx.ui.guestQ, ctx.ui.guestSortAsc)}</div>
        </div>
      </section>
      <aside class="updates" aria-label="Updates" data-figma-node="301:1609">
        <div class="updates-search search">${icon("search")}<input class="input" type="search" placeholder="Search" value="${esc(ctx.ui.updatesQ)}" data-on-input="updatesQ" aria-label="Search updates"></div>
        <div class="panel">
          <div class="panel-head"><span class="panel-icon">${icon("list")}</span><h2 style="font-weight:500;font-size:16px;color:var(--body)">Updates</h2></div>
          <div class="updates-list" id="updates-list">${updatesPanel(ctx.ui.updatesQ)}</div>
        </div>
      </aside>
    </div>`;
  }

  return { render, updateCard, updatesPanel, guestRows };
})();

</script>

/* ==========================================================================
   Residents — Figma 238:6730 (tabs), 238:4052 (filter builder + custom tab)
   Resident profile — Figma 238:7204, refined in 293:10380
   ========================================================================== */
window.HMS = window.HMS || {};
HMS.views = HMS.views || {};

HMS.views.residents = (function () {
  const { icon, esc, kv, phoneMask } = HMS.ui;
  const D = HMS.date;
  const S = HMS.store.sel;

  const BASE_TABS = ["Bachelors", "Masters", "PhD", "Guests"];
  const COLS = {
    resident: [
      { key: "room", label: "Room No." }, { key: "roll", label: "Roll Number" }, { key: "name", label: "Name" },
      { key: "dept", label: "Department" }, { key: "program", label: "Program" }, { key: "contact", label: "Contact", fmt: phoneMask },
    ],
    guest: [
      { key: "room", label: "Room Alloted" }, { key: "name", label: "Name" }, { key: "arrival", label: "Arrival Date", fmt: D.fmt },
      { key: "departure", label: "Departure Date", fmt: D.fmt }, { key: "requestedBy", label: "Requested by" }, { key: "contact", label: "Contact", fmt: phoneMask },
    ],
  };
  const OPS = { contains: "Contains", is: "Is", not: "Is not", starts: "Starts with" };

  function applyFilters(rows, filters) {
    return rows.filter((r) => filters.every((f) => {
      if (!f.col || f.val === "") return true;
      const v = String(r[f.col] ?? "").toLowerCase(), q = String(f.val).toLowerCase();
      return f.op === "is" ? v === q : f.op === "not" ? v !== q : f.op === "starts" ? v.startsWith(q) : v.includes(q);
    }));
  }

  function rowsFor(ctx) {
    const u = ctx.ui.res;
    const custom = S.customTabs().find((t) => t.id === u.tab);
    const base = custom ? custom.base : u.tab;
    let rows = S.residentRows(base, ctx.ui.day);
    if (base === "Guests" && ctx.query.arriving) rows = rows.filter((r) => r.arrival === ctx.ui.day);
    if (base === "Guests" && ctx.query.leaving) rows = rows.filter((r) => r.departure === ctx.ui.day);
    rows = applyFilters(rows, [...(custom ? custom.filters : []), ...u.filters]);
    if (u.q) { const q = u.q.toLowerCase(); rows = rows.filter((r) => Object.values(r).some((v) => String(v).toLowerCase().includes(q))); }
    const k = u.sort.key, dir = u.sort.dir;
    rows.sort((a, b) => String(a[k]).localeCompare(String(b[k]), undefined, { numeric: true }) * dir);
    return { rows, base, cols: base === "Guests" ? COLS.guest : COLS.resident };
  }

  function filterPop(ctx, cols) {
    const f = ctx.ui.res.filters.length ? ctx.ui.res.filters : [{ col: "", op: "contains", val: "" }];
    return `<div class="popover filter-pop" role="dialog" aria-label="Filter residents">
      <header><span>Where:</span><button class="link" data-act="clearFilters" style="font-size:10px">clear filters</button></header>
      <div class="filter-rows">
        ${f.map((r, i) => `<div class="filter-row">
          <select aria-label="Column" data-on-change="filterEdit" data-i="${i}" data-k="col"><option value="">Select Column</option>${cols.map((c) => `<option value="${c.key}" ${c.key === r.col ? "selected" : ""}>${c.label}</option>`).join("")}</select>
          <select aria-label="Condition" data-on-change="filterEdit" data-i="${i}" data-k="op">${Object.entries(OPS).map(([k, l]) => `<option value="${k}" ${k === r.op ? "selected" : ""}>${l}</option>`).join("")}</select>
          <input aria-label="Value" placeholder="Value" value="${esc(r.val)}" data-on-input="filterEdit" data-i="${i}" data-k="val">
          <button data-act="filterRemove" data-i="${i}" aria-label="Remove filter">${icon("x")}</button>
        </div>`).join("")}
      </div>
      <button class="filter-add" data-act="filterAdd">Add filter +</button>
      <div class="filter-foot"><button class="btn btn-secondary" data-act="saveTabPrompt">Save as tab</button><button class="btn btn-primary" data-act="closeFilter">Done</button></div>
    </div>`;
  }

  function table(ctx) {
    const u = ctx.ui.res;
    const { rows, cols } = rowsFor(ctx);
    const per = u.perPage === "All" ? rows.length || 1 : Number(u.perPage);
    const pages = Math.max(1, Math.ceil(rows.length / per));
    const page = Math.min(u.page, pages);
    const slice = rows.slice((page - 1) * per, page * per);
    if (!rows.length) return `<div class="empty"><strong>No one matches</strong>Clear the search or filters to see everyone.</div>`;
    let lastFloor = null;
    const body = slice.map((r) => {
      const fl = HMS.floorplan.parseRoom(r.room).floor;
      const brk = u.sort.key === "room" && lastFloor !== null && fl !== lastFloor ? `<tr class="floor-break" aria-hidden="true"><td colspan="${cols.length + 1}"></td></tr>` : "";
      lastFloor = fl;
      const target = r.kind === "resident" ? `#/residents/${r.id}` : `#/map?floor=${fl}&room=${r.room}`;
      return `${brk}<tr>
        ${cols.map((c) => `<td>${esc(c.fmt ? c.fmt(r[c.key]) : r[c.key])}</td>`).join("")}
        <td><div class="actions">
          <button data-act="go" data-href="${target}" aria-label="View ${esc(r.name)}">${icon("eye")}</button>
          <button data-act="${r.kind === "resident" ? "editResident" : "editGuestStay"}" data-id="${r.id}" aria-label="Edit ${esc(r.name)}">${icon("pencil")}</button>
        </div></td></tr>`;
    }).join("");
    return `<div class="table-wrap"><table class="data">
      <thead><tr>${cols.map((c) => `<th scope="col"><button class="sort-th" data-act="sortBy" data-key="${c.key}">${c.label}${u.sort.key === c.key ? icon(u.sort.dir > 0 ? "caretDown" : "caretUp") : ""}</button></th>`).join("")}<th><span class="sr-only">Actions</span></th></tr></thead>
      <tbody>${body}</tbody></table></div>
      <div class="pager"><span class="num">${(page - 1) * per + 1}–${Math.min(page * per, rows.length)} of ${rows.length}</span>
        ${pages > 1 ? `<div class="row"><button class="btn btn-secondary" data-act="page" data-d="-1" ${page <= 1 ? "disabled" : ""}>Previous</button><button class="btn btn-secondary" data-act="page" data-d="1" ${page >= pages ? "disabled" : ""}>Next</button></div>` : ""}
      </div>`;
  }

  function render(ctx) {
    const u = ctx.ui.res;
    const { cols } = rowsFor(ctx);
    const custom = S.customTabs();
    const nFilters = u.filters.filter((f) => f.col && f.val !== "").length;
    const note = ctx.query.arriving ? "Showing guests arriving on " + D.fmt(ctx.ui.day) : ctx.query.leaving ? "Showing guests leaving on " + D.fmt(ctx.ui.day) : "";
    return `<section data-figma-node="238:6730">
      <div class="page-head"><h1 class="page-title">Residents</h1>
        <button class="btn btn-secondary" data-act="exportResidents">${icon("download")} Copy as CSV</button></div>
      <div class="toolbar">
        <div class="toolbar-left" style="position:relative">
          <button class="filter-btn" data-act="toggleFilter" aria-expanded="${u.filterOpen}">Filter ${nFilters ? `<span class="count">${nFilters}</span>` : ""}${icon("funnel")}</button>
          ${u.filterOpen ? filterPop(ctx, cols) : ""}
          ${note ? `<span class="badge badge-teal">${note}</span> <button class="link" data-act="go" data-href="#/residents?tab=Guests" style="font-size:12px">Show all guests</button>` : ""}
        </div>
        <div class="toolbar-right">
          <label class="rows-label" for="perpage">Rows per page</label>
          <span class="mini-select"><select id="perpage" data-on-change="perPage">${["25", "50", "100", "All"].map((v) => `<option ${v === u.perPage ? "selected" : ""}>${v}</option>`).join("")}</select>${icon("caretDown")}</span>
          <span class="search">${icon("search")}<input class="input" type="search" placeholder="Search" value="${esc(u.q)}" data-on-input="resQ" aria-label="Search residents"></span>
        </div>
      </div>
      <div class="tabs" role="tablist">
        ${BASE_TABS.map((t) => `<button class="tab" role="tab" aria-selected="${u.tab === t}" data-act="resTab" data-tab="${t}">${t}</button>`).join("")}
        ${custom.map((t) => `<button class="tab" role="tab" aria-selected="${u.tab === t.id}" data-act="resTab" data-tab="${t.id}">${esc(t.name)}<span class="tab-x" data-act="removeTab" data-id="${t.id}" aria-label="Remove tab">${icon("x")}</span></button>`).join("")}
        <button class="tab tab-add" data-act="saveTabPrompt" aria-label="Save current view as a tab">+</button>
      </div>
      <div id="res-table">${table(ctx)}</div>
    </section>`;
  }

  /* ------------------------------ Profile ------------------------------ */
  function profile(ctx, id) {
    const r = S.resident(id);
    if (!r) return `<div class="empty"><strong>Resident not found</strong><button class="link" data-act="go" data-href="#/residents">Back to residents</button></div>`;
    const status = r.room ? `<span class="badge badge-info">Occupied</span>` : `<span class="badge badge-grey">Vacated</span>`;
    const roommates = r.room ? S.occupants(r.room, ctx.ui.day).filter((o) => o.person && o.person.id !== r.id) : [];
    const hist = r.history.map((h, i) => h.type === "shift"
      ? `<li class="marker">${esc(h.note)}</li>`
      : `<li class="${i === 0 && h.type === "allotted" && r.room ? "current" : ""}">${h.type === "allotted" ? "Allotted" : "Vacated"} ${h.hostel ? esc(h.hostel) + " – " : ""}${esc(h.room)}<small>${D.fmt(h.date)} onwards</small></li>`).join("");
    return `<section data-figma-node="293:10380">
      <button class="back" data-act="back">${icon("caretLeft")} Residents</button>
      <div class="page-head">
        <h1 class="page-title">Resident<span class="sep">|</span>${r.room ? esc(r.room) : "No room"}</h1>
        <div class="profile-actions">
          <span style="font-size:12px;align-self:center">Room Status:</span> ${status}
          <button class="btn btn-secondary" data-act="editResident" data-id="${r.id}">${icon("pencil")} Edit</button>
          ${r.room ? `<button class="btn btn-secondary" data-act="go" data-href="#/map?floor=${HMS.floorplan.parseRoom(r.room).floor}&room=${r.room}">${icon("door")} Show on map</button>
          <button class="btn btn-danger" data-act="vacateResident" data-id="${r.id}">Mark vacated</button>` : ""}
        </div>
      </div>
      <div class="profile">
        <div class="profile-cards">
          <div class="pcard"><h2>Personal Details</h2><div class="pgrid pgrid-3">
            ${kv("Name", esc(r.name))}${kv("Roll Number", esc(r.roll))}${kv("Email", esc(r.email))}
            ${kv("Mobile", esc(phoneMask(r.phone)))}${kv("Date of Birth", D.fmt(r.dob))}${kv("Gender", esc(r.gender))}
            ${kv("Nationality", esc(r.nationality))}${kv("Joining Date", D.fmt(r.joined))}${kv("Hostel / Room No.", "H17 – " + esc(r.room || "—"))}
            <div style="grid-column:1/-1">${kv("Permanent Address", esc(r.homeAddress))}</div>
          </div></div>
          <div class="pcard"><h2>Academic Details</h2><div class="pgrid pgrid-3">
            ${kv("Programme", esc(r.degree) + " · " + esc(r.programGroup))}${kv("Department", esc(r.dept))}${kv("Current Semester", r.semester + (r.semester === 1 ? "st" : r.semester === 2 ? "nd" : r.semester === 3 ? "rd" : "th") + " semester")}
            ${kv("Faculty Advisor", esc(r.advisor.name))}${kv("Mentor", esc(r.mentor.name))}${kv("Expected exit", D.fmt(r.expectedExit))}
          </div></div>
          <div class="pcard"><h2>People to contact</h2><div class="pgrid">
            ${kv("Local Guardian · " + esc(r.guardian.relation), esc(r.guardian.name))}${kv("Contact Number", esc(phoneMask(r.guardian.phone)))}
            ${kv("Roommate", roommates.length ? roommates.map((o) => esc(o.person.name)).join(", ") : "Single occupancy")}${kv("Contact Number", roommates[0] ? esc(phoneMask(roommates[0].person.phone || roommates[0].person.contact)) : "—")}
            ${kv("Emergency Contact No. 1", esc(phoneMask(r.emergency[0])))}${kv("Emergency Contact No. 2", esc(phoneMask(r.emergency[1])))}
          </div></div>
          <div class="pcard"><h2>Medical Details</h2><div class="pgrid">${kv("Blood Group", esc(r.blood))}</div></div>
          <div class="pcard"><h2>Remarks</h2>
            ${r.remarks.length ? `<ul style="margin:0 0 12px;padding-left:18px;font-size:13px;line-height:1.5">${r.remarks.map((m) => `<li>${esc(m.text)} <span class="muted" style="font-size:11px">· ${D.fmt(m.date)}, ${esc(m.by)}</span></li>`).join("")}</ul>` : `<p class="muted" style="font-size:12px;margin:0 0 12px">No remarks yet. Notes you add here replace the side Excel sheets.</p>`}
            <div style="display:flex;gap:8px"><input class="input" style="flex:1" placeholder="Add a remark" id="remark-input"><button class="btn btn-primary" data-act="addRemark" data-id="${r.id}">Add remark</button></div>
          </div>
        </div>
        <aside class="history" aria-label="Occupancy history"><h2>Occupancy History</h2><ol>${hist || `<li>No history yet</li>`}</ol></aside>
      </div>
    </section>`;
  }

  return { render, profile, table, rowsFor, COLS };
})();
